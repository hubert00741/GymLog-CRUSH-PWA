}

/* Plan is permanently visible during a workout */

.lux-current-grid{
  display:grid;

}

}

  padding:4px 7px;

  color:#ff7180;
  background:rgba(255,39,56,.09);
  border:1px solid rgba(255,39,56,.19);
}
.lux-delta.flat{
  color:#aaaab0;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);

  display:grid;
  gap:9px;
  margin-bottom:18px;
}

    var d = JSON.parse(raw);
    if(!d.logs) d.logs = [];
    if(!d.lastByExercise) d.lastByExercise = {};
    if(!d.lastSetsByExercise) d.lastSetsByExercise = {};
    if(!d.lastMeta) d.lastMeta = {};
    if(!d.planOverrides) d.planOverrides = {};
    if(!d.appUpdates) d.appUpdates = [];
    if(!("draft" in d)) d.draft = null;
    return d;
  }catch(e){
    return {logs:[],lastByExercise:{},lastSetsByExercise:{},lastMeta:{},draft:null,planOverrides:{},appUpdates:[],storageError:String(e)};
  }
}

}

function esc(x){

function today(){

}

function fmt(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
}

    try{document.documentElement.scrollTop=0;document.body.scrollTop=0;}catch(e){}
  });
}

function stopTimer(){
  if(timer){clearInterval(timer);timer = null;}
}

function copyText(text){

  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.focus();
  area.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(area);
}

function storageWarning(){
  if(!data.storageError) return "";
  return "<div class='err'>Uwaga: pamięć może działać niestabilnie.\n" + esc(data.storageError) + "</div>";
}

function clonePlan(planName){
  var ex = JSON.parse(JSON.stringify(PLANS[planName]));
  ex.forEach(function(e){
    e.sets = [];
    if(data.planOverrides && data.planOverrides[planName] && data.planOverrides[planName][e.name]){
      e.plan = data.planOverrides[planName][e.name];
    }
  });
  return ex;
}

function isBodyweightExercise(ex){
  if(ex && ex.bodyweight) return true;
  var n = String(ex && ex.name ? ex.name : "").toLowerCase();
  return n.indexOf("podciągan") >= 0 || n.indexOf("dipy") >= 0 || n.indexOf("dip") >= 0 || n.indexOf("pompki") >= 0 || n.indexOf("pull-up") >= 0 || n.indexOf("pull up") >= 0 || n.indexOf("chin-up") >= 0 || n.indexOf("chin up") >= 0;
}

function normalizeNumberText(x){return String(x || "").trim().replace(",", ".");}

function displayNumber(x){
  return String(x || "").replace(".", ",");
}

function prettyBodyweightLoad(raw){
  var t = String(raw || "").trim();
  if(t === "") return "masa ciała";
  var n = parseFloat(normalizeNumberText(t));
  if(isNaN(n)) return t;
  if(n === 0) return "masa ciała";
  if(n > 0) return "masa ciała +" + t + " kg";
  return "asysta " + String(Math.abs(n)).replace(".", ",") + " kg";
}

function makeSetLine(ex,w,r,s,n){
  var line = "";
  if(isBodyweightExercise(ex)){
    if(w || r) line += prettyBodyweightLoad(w);
  }else{
    if(w) line += w + " kg";
  }
  if(r) line += (line ? " x " : "x ") + r;
  if(s) line += " — " + s;
  if(n) line += " | " + n;
  return line;
}

function getSetLine(s){
  if(!s) return "";
  if(typeof s === "string") return s;
  return s.line || "";
}

function parseSetLine(line, ex){
  var raw = String(line || "").trim();
  var out = {line:raw,w:"",r:"",s:"",n:""};

  if(!raw) return out;

  var lower = raw.toLowerCase();
  if(lower.indexOf("pominięte") >= 0 || lower.indexOf("pominiete") >= 0){
    out.s = "pominięte";
    var partsSkip = raw.split("—");
    if(partsSkip[1]) out.n = partsSkip[1].trim();
    return out;
  }

  var noteParts = raw.split("|");
  if(noteParts.length > 1){
    out.n = noteParts.slice(1).join("|").trim();
    raw = noteParts[0].trim();
  }

  var statusParts = raw.split("—");
  if(statusParts.length > 1){
    out.s = statusParts.slice(1).join("—").trim();
    raw = statusParts[0].trim();
  }

  var repMatch = raw.match(/x\s*([0-9]+(?:[\-,][0-9]+)?)/i);
  if(repMatch) out.r = repMatch[1].trim();

  if(isBodyweightExercise(ex)){
    if(raw.toLowerCase().indexOf("masa ciała") >= 0 || raw.toLowerCase().indexOf("masa ciala") >= 0){
      var plusMatch = raw.match(/\+\s*([0-9]+(?:[\.,][0-9]+)?)/);
      out.w = plusMatch ? displayNumber(plusMatch[1]) : "0";
    }else if(raw.toLowerCase().indexOf("asysta") >= 0){
      var assistMatch = raw.match(/asysta\s*([0-9]+(?:[\.,][0-9]+)?)/i);
      out.w = assistMatch ? "-" + displayNumber(assistMatch[1]) : "";
    }else{
      var bwKg = raw.match(/([0-9]+(?:[\.,][0-9]+)?)\s*kg/i);
      out.w = bwKg ? displayNumber(bwKg[1]) : "";
    }
  }else{
    var kgMatch = raw.match(/([0-9]+(?:[\.,][0-9]+)?)\s*kg/i);
    out.w = kgMatch ? displayNumber(kgMatch[1]) : "";
  }

  return out;
}

function parseLastTextToSets(text, ex){
  var t = String(text || "").trim();
  if(!t) return [];

  var colon = t.indexOf(":");
  if(colon >= 0 && colon < 25){
    var prefix = t.slice(0, colon).toLowerCase();
    if(/[0-9]/.test(prefix) || prefix.indexOf("202") >= 0 || prefix.indexOf(".") >= 0){
      t = t.slice(colon + 1).trim();
    }
  }

  var parts = t.split(";").map(function(x){return x.trim();}).filter(function(x){return x.length > 0;});
  if(!parts.length && t) parts = [t];

  return parts.map(function(line){return parseSetLine(line, ex);}).filter(function(s){
    return s.line && s.line.toLowerCase().indexOf("brak") < 0;
  });
}

function isWorkingSet(s){
  var line = getSetLine(s).toLowerCase();
  if(!line) return false;
  if(line.indexOf("rozgrzewka") >= 0) return false;
  if(line.indexOf("pominięte") >= 0) return false;
  if(line.indexOf("pominiete") >= 0) return false;
  return true;
}

function getRecordRestByWeight(w){
  var n = parseFloat(normalizeNumberText(w));
  if(isNaN(n)) return 180;
  if(n <= 85) return 120;
  if(n < 95) return 180;
  return 300;
}

function getRestForSet(ex,w){
  if(ex && ex.autoRestRecord) return getRecordRestByWeight(w);
  return ex.rest || 120;
}

function restDescription(ex){
  if(ex && ex.autoRestRecord) return "Automatyczna:\n≤85 kg = 02:00\n>85 kg = 03:00\n≥95 kg = 05:00";
  return fmt(ex.rest);
}

function restDescriptionReport(ex){
  if(ex && ex.autoRestRecord) return "Automatyczna: ≤85 kg = 02:00 / >85 kg = 03:00 / ≥95 kg = 05:00";
  return fmt(ex.rest);
}

function getSuggestion(ex){
  var setNo = ex.sets ? ex.sets.length : 0;
  var arr = data.lastSetsByExercise && data.lastSetsByExercise[ex.name] ? data.lastSetsByExercise[ex.name] : null;

  if(arr && arr[setNo]){
    if(typeof arr[setNo] === "string") return parseSetLine(arr[setNo], ex);
    return arr[setNo];
  }

  var lastText = data.lastByExercise && data.lastByExercise[ex.name] ? data.lastByExercise[ex.name] : "";
  if(lastText){
    var parsed = parseLastTextToSets(lastText, ex);
    if(parsed && parsed[setNo]) return parsed[setNo];
  }

  return {w:"",r:"",s:"",n:""};
}

function volumeSummary(log){
  var volume = {};
  if(!log || !log.exercises) return volume;

  log.exercises.forEach(function(e){
    var groups = e.groups || [];
    if(!groups.length) groups = ["Inne"];

    var count = 0;
    (e.sets || []).forEach(function(s){
      if(isWorkingSet(s)) count++;
    });

    if(count > 0){
      groups.forEach(function(g){
        if(!volume[g]) volume[g] = 0;
        volume[g] += count;
      });
    }
  });

  return volume;
}

function volumeSummaryText(log){
  var v = volumeSummary(log);
  var keys = Object.keys(v);
  if(!keys.length) return "Brak serii roboczych.";
  keys.sort();
  return keys.map(function(k){return k + ": " + v[k] + " serii";}).join("\n");
}

function recomputeLastByExercise(){
  var rebuilt = {};
  var rebuiltSets = {};

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    log.exercises.forEach(function(e){
      if(e.sets && e.sets.length){
        var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
        if(lines.length){
          rebuilt[e.name] = log.date + ": " + lines.join("; ");
          rebuiltSets[e.name] = e.sets.map(function(s){
            if(typeof s === "string") return parseSetLine(s, e);
            if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
            return s;
          });
        }
      }
    });
  }

  data.lastByExercise = rebuilt;
  data.lastSetsByExercise = rebuiltSets;
  safeSave();
}

function selected(currentValue, optionValue){

}

function exercise(){
  stopTimer();
  if(!current){home();return;}

  current.index = idx;
  data.draft = current;
  safeSave();

  var e = current.exercises[idx];

  }

  var sg = getSuggestion(e);
  var extraInfo = "";
  if(isBodyweightExercise(e)){
    extraInfo += "<div class='box small'>Typ ciężaru: masa ciała\n0 = masa ciała\n10 = masa ciała +10 kg\n-20 = asysta 20 kg</div>";
  }
  if(e.autoRestRecord){
    extraInfo += "<div class='box small'>Przerwa automatyczna pod rekord:\n≤85 kg = 02:00\n>85 kg = 03:00\n≥95 kg = 05:00</div>";
  }
  if(current.testMode){
    extraInfo += "<div class='box small'>TRYB TESTOWY: trening nie zapisze historii i nie zmieni ostatnich wyników.</div>";
  }
  if(sg && (sg.w || sg.r || sg.s || sg.n)){
    extraInfo += "<div class='box small'>Auto-uzupełnienie: pola poniżej są z ostatniego normalnie zapisanego treningu dla tej samej serii. Możesz je poprawić przed zapisem.</div>";
  }

  render(
    "<h1>GymLog CRUSH</h1><div class='small'>" + esc(current.date) + " — " + esc(current.training) + "</div><div class='badge'>Ćwiczenie " + (idx+1) + " / " + current.exercises.length + "</div>" +
    "<div class='card'><h2>" + esc(e.name) + "</h2><h3>Ostatnio zrobione</h3><div class='box'>" + esc(last) + "</div><h3>Plan na dziś</h3><div class='box'>" + esc(e.plan) + "</div><h3>Przerwa</h3><div class='box'><b>" + esc(restDescription(e)) + "</b></div>" + extraInfo + "</div>" +
    "<div class='card'><h2>Wpisz serię</h2>" +
    "<div class='row3'><div><label>Ciężar</label><input id='sw' inputmode='decimal' value='" + esc(sg.w || "") + "' placeholder='85'></div><div><label>Powt.</label><input id='sr' inputmode='numeric' value='" + esc(sg.r || "") + "' placeholder='8'></div><div><label>Status</label><select id='ss'><option></option><option" + selected(sg.s,"rozgrzewka") + ">rozgrzewka</option><option" + selected(sg.s,"zapas 3") + ">zapas 3</option><option" + selected(sg.s,"zapas 2") + ">zapas 2</option><option" + selected(sg.s,"zapas 1") + ">zapas 1</option><option" + selected(sg.s,"odcina techniczna") + ">odcina techniczna</option><option" + selected(sg.s,"fail") + ">fail</option><option" + selected(sg.s,"ból / przerwane") + ">ból / przerwane</option></select></div></div>" +
    "<label>Notatka</label><input id='sn' value='" + esc(sg.n || "") + "' placeholder='np. poszło lekko'>" +
    "<button onclick='saveSet()'>Zapisz serię + start timer</button><button class='warn' onclick='skipExerciseView()'>Pomiń ćwiczenie</button><div id='timer' class='timer'>00:00</div><button class='secondary' onclick='restartTimer()'>Restart przerwy</button><button class='secondary' onclick='stopTimer()'>Stop timer</button></div>" +
    "<div class='card'><h2>Zrobione serie</h2>" + sets + "<button class='danger' onclick='deleteLastSet()'>Usuń ostatnią serię</button></div>" +
    "<div class='row'><button class='secondary' onclick='prevExercise()'>Poprzednie</button><button onclick='nextExercise()'>Następne</button></div>" +

  );

window.saveSet = function(){
  var e = current.exercises[idx];
  var w = document.getElementById("sw").value.trim();
  var r = document.getElementById("sr").value.trim();
  var s = document.getElementById("ss").value.trim();
  var n = document.getElementById("sn").value.trim();

  if(!w && !r && !s && !n){alert("Wpisz serię.");return;}

  var line = makeSetLine(e,w,r,s,n);
  e.sets.push({line:line,w:w,r:r,s:s,n:n,createdAt:new Date().toISOString()});

  current.index = idx;
  data.draft = current;
  safeSave();

  exercise();
  startRest(getRestForSet(e,w));
};

window.skipExerciseView = function(){

window.saveSkipExercise = function(){
  var e = current.exercises[idx];
  var reason = document.getElementById("skipReason").value;
  var note = document.getElementById("skipNote").value.trim();
  var line = "pominięte — " + reason;
  if(note) line += " | " + note;
  e.sets.push({line:line,w:"",r:"",s:"pominięte",n:reason + (note ? " | " + note : ""),skipped:true});

function startRest(sec){
  stopTimer();
  var end = Date.now() + sec * 1000;

  timer = setInterval(function(){
    var left = Math.ceil((end - Date.now()) / 1000);
    var el = document.getElementById("timer");
    if(!el) return;

    if(left <= 0){
      stopTimer();
      el.innerText = "GOTOWE";
      el.className = "timer ready";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }else{
      el.innerText = fmt(left);
      el.className = "timer running";
    }
  },300);
}

window.restartTimer = function(){
  if(!current) return;
  var e = current.exercises[idx];
  startRest(e.autoRestRecord ? 180 : e.rest);
};

window.stopTimer = stopTimer;

window.deleteLastSet = function(){

  if(!e.sets || !e.sets.length) return;
  e.sets.pop();

  safeSave();

window.prevExercise = function(){

function makeReport(log){
  var out = "";
  out += "GYMLOG_CRUSH_V2.7\n";
  out += "Data: " + log.date + "\n";
  out += "Trening: " + log.training + "\n";
  out += "Tryb testowy: " + (log.testMode ? "TAK" : "NIE") + "\n";
  out += "Sen: " + log.sleep + "\n";
  out += "Waga: " + log.weight + "\n";
  out += "Samopoczucie: " + log.mood + "\n";
  out += "Trzeszczka/paluch przy chodzeniu 0-10: " + log.footWalk + "\n";
  out += "Trzeszczka/paluch przy wybiciu 0-10: " + log.footPush + "\n";
  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var oldLast = e.reportLast || e.last || "brak";
    out += "\n" + (i+1) + ". " + e.name + "\n";
    out += "Ostatnio: " + oldLast + "\n";
    out += "Plan na dziś: " + e.plan.replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";
    out += "Zrobione:\n";
    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";
    else e.sets.forEach(function(s){out += "- " + getSetLine(s) + "\n";});
  });

  out += "\nPodsumowanie serii roboczych na partie:\n";
  out += volumeSummaryText(log) + "\n";
  out += "\nEND_GYMLOG_CRUSH";
  return out;
}

window.finishWorkout = function(){
  if(!current) return;

  current.exercises.forEach(function(e){e.reportLast = data.lastByExercise[e.name] || e.last || "brak";});

  if(!current.testMode){

function parseGoalUpdate(txt){
  var lines = String(txt || "").split(/\r?\n/);
  var items = [];
  var currentPlan = null;
  var currentExercise = null;
  var buf = [];

  function flush(){
    if(currentPlan && currentExercise && buf.length){
      items.push({plan:currentPlan,exercise:currentExercise,goal:buf.join("\n").trim()});
    }
    currentExercise = null;
    buf = [];
  }

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    if(line === "GYMLOG_PLAN_UPDATE_V1") continue;
    if(line === "END_UPDATE"){
      flush();
      break;
    }

    if(PLANS[line]){
      flush();
      currentPlan = line;
      continue;
    }

    if(line.endsWith(":")){
      flush();
      if(!currentPlan){
        return {ok:false,message:"Błąd: najpierw podaj nazwę planu, np. Day 1 PUSH."};
      }
      currentExercise = line.slice(0,-1).trim();
      continue;
    }

    if(currentPlan && currentExercise){
      buf.push(line);
    }
  }

  flush();

  if(!items.length){
    return {ok:false,message:"Nie znaleziono żadnych celów do aktualizacji. Sprawdź format bloku."};
  }

  var errors = [];
  items.forEach(function(item){
    var found = false;
    (PLANS[item.plan] || []).forEach(function(e){
      if(e.name === item.exercise) found = true;
    });
    if(!found) errors.push(item.plan + " — nie znaleziono ćwiczenia: " + item.exercise);
  });

  if(errors.length){
    return {ok:false,message:"Błąd nazw ćwiczeń:\n" + errors.join("\n")};
  }

  return {ok:true,items:items};
}

function parseAppUpdate(txt){
  var raw = String(txt || "");
  if(raw.indexOf("GYMLOG_APP_UPDATE_V1") < 0) return {ok:false,message:"Brak nagłówka GYMLOG_APP_UPDATE_V1."};
  if(raw.indexOf("END_APP_UPDATE") < 0) return {ok:false,message:"Brak końcówki END_APP_UPDATE."};

  var idMatch = raw.match(/ID:\s*(.+)/);
  var verMatch = raw.match(/WERSJA:\s*(.+)/);
  var codeStart = raw.indexOf("KOD:");
  var codeEnd = raw.lastIndexOf("END_APP_UPDATE");

  if(!idMatch) return {ok:false,message:"Brak ID poprawki."};
  if(codeStart < 0) return {ok:false,message:"Brak sekcji KOD:."};

  var code = raw.slice(codeStart + 4, codeEnd).trim();
  if(!code) return {ok:false,message:"Sekcja KOD jest pusta."};

  return {
    ok:true,
    id:idMatch[1].trim(),
    version:verMatch ? verMatch[1].trim() : "",
    code:code
  };
}

window.applyAppUpdate = function(){
  var txt = document.getElementById("appUpdateText").value;
  var parsed = parseAppUpdate(txt);

  if(!parsed.ok){
    render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='err'>" + esc(parsed.message) + "</div><button class='secondary' onclick='appUpdateView()'>Wróć</button>");
    return;
  }

  try{
    eval(parsed.code);
  }catch(e){
    render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='err'>Patch nie został zainstalowany, bo kod ma błąd:\n" + esc(String(e)) + "</div><button class='secondary' onclick='appUpdateView()'>Wróć</button>");
    return;
  }

  if(!data.appUpdates) data.appUpdates = [];
  data.appUpdates = data.appUpdates.filter(function(u){return u.id !== parsed.id;});
  data.appUpdates.push({
    id:parsed.id,
    version:parsed.version,
    code:parsed.code,
    installedAt:new Date().toISOString()
  });

  safeSave();

  render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='ok'>Zainstalowano poprawkę:\n" + esc(parsed.id) + "\nWersja: " + esc(parsed.version || "-") + "</div><button onclick='home()'>Menu</button>");
};

window.statusMapNew = function(v){
  v = String(v || "").trim();
  if(v === "zapas 3") return "zapas 2-3";
  if(v === "zapas 2") return "zapas 2-3";
  if(v === "odcina techniczna") return "zapas 0-1";
  if(v === "fail") return "FAIL";
  return v;
};

isWorkingSet = function(s){
  var line = getSetLine(s).toLowerCase();
  var st = String((s && (s.s || s.status)) || "").toLowerCase();
  if(!line) return false;
  if(line.indexOf("rozgrzewka") >= 0 || st === "rozgrzewka") return false;
  if(line.indexOf("pominięte") >= 0 || line.indexOf("pominiete") >= 0 || st.indexOf("pomini") >= 0) return false;
  if(line.indexOf("fail") >= 0 || st === "fail") return false;
  if(line.indexOf("ból / przerwane") >= 0 || line.indexOf("bol / przerwane") >= 0 || st.indexOf("przerwane") >= 0) return false;
  return true;
};

window.realWorkingSetsCount = function(log){
  var total = 0;
  if(!log || !log.exercises) return 0;
  log.exercises.forEach(function(e){
    (e.sets || []).forEach(function(s){
      if(isWorkingSet(s)) total++;
    });
  });
  return total;
};

volumeSummaryText = function(log){
  var v = volumeSummary(log);
  var keys = Object.keys(v);
  var realTotal = realWorkingSetsCount(log);

  if(!keys.length){
    return "Realnie wykonane: " + realTotal + " serii roboczych\n\nBrak obciążenia partii.";
  }

  var assignedTotal = 0;
  keys.forEach(function(k){ assignedTotal += v[k]; });

  keys.sort(function(a,b){
    if(v[b] !== v[a]) return v[b] - v[a];
    return a.localeCompare(b);
  });

  var out = "";
  out += "Realnie wykonane: " + realTotal + " serii roboczych\n";
  out += "Suma przypisań do partii: " + assignedTotal + "\n";
  out += "Jedna seria może liczyć się do kilku partii, np. przysiad = czwórki + pośladek.\n\n";
  out += "Udział obciążenia partii:\n";

  keys.forEach(function(k){
    var pct = assignedTotal > 0 ? (v[k] / assignedTotal * 100) : 0;
    var pctText = pct.toFixed(1).replace(".0","").replace(".",",");
    out += k + ": " + v[k] + " serii przypisanych — " + pctText + "%\n";
  });

  return out.trim();
};

window.getPlanOrder = function(){
  var preferred = ["Day 1 PUSH","Day 2 PULL","Day 3 UPPER","Nogi","Brzuch","Płaska rekord"];
  var existing = Object.keys(PLANS);
  var ordered = [];
  preferred.forEach(function(p){ if(PLANS[p]) ordered.push(p); });
  existing.forEach(function(p){ if(ordered.indexOf(p) < 0) ordered.push(p); });
  return ordered;
};

window.planPrettyHtml = function(plan){
  var raw = String(plan || "").trim();
  if(!raw) return "<div class='small'>Brak planu.</div>";

  var lines = raw.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  if(lines.length === 1 && raw.indexOf(" / ") >= 0){
    lines = raw.split(" / ").map(function(x){return x.trim();}).filter(Boolean);
  }

  var html = "";
  var step = 0;

  lines.forEach(function(line){
    var lower = line.toLowerCase();
    var isNote =
      lower.indexOf("jeśli") === 0 ||
      lower.indexOf("nie ") === 0 ||
      lower.indexOf("tylko") === 0 ||
      lower.indexOf("bez ") === 0 ||
      lower.indexOf("pięta") === 0 ||
      lower.indexOf("technika") === 0 ||
      lower.indexOf("pełna") === 0 ||
      lower.indexOf("cel:") === 0 ||
      lower.indexOf("miednica") === 0 ||
      lower.indexOf("wolniej") === 0 ||
      lower.indexOf("klasyczny") === 0 ||
      lower.indexOf("łokcia") >= 0 ||
      lower.indexOf("palucha") >= 0 ||
      lower.indexOf("kontrola") >= 0;

    var looksLikeSet =
      lower.indexOf(" x ") >= 0 ||
      lower.indexOf("kg") >= 0 ||
      lower.indexOf("masa ciała") >= 0 ||
      lower.indexOf("aktywacja") >= 0 ||
      lower.indexOf("pomiń") >= 0;

    if(looksLikeSet && !isNote){
      step++;
      html += "<div style='display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:9px 10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04);'>" +
        "<div style='min-width:28px;height:28px;border-radius:999px;background:rgba(255,0,70,.22);display:flex;align-items:center;justify-content:center;font-weight:800;'>" + step + "</div>" +
        "<div style='flex:1;font-size:15px;line-height:1.35;'>" + esc(line) + "</div></div>";
    }else{
      html += "<div class='small' style='margin:8px 0;padding:8px 10px;border-left:3px solid rgba(255,255,255,.22);background:rgba(255,255,255,.03);border-radius:8px;'>" + esc(line) + "</div>";
    }
  });

  return html;
};

window.exerciseLiveSummaryHtml = function(e){
  if(!e || !e.sets || !e.sets.length) return "<div class='small'>Brak serii roboczych w tym ćwiczeniu.</div>";

  var working = e.sets.filter(function(s){ return isWorkingSet(s); });
  if(!working.length) return "<div class='small'>Serie robocze: 0</div>";

  var heaviest = null;
  var best = null;
  var bestScore = -999999;

  working.forEach(function(s){
    var w = parseFloat(normalizeNumberText(s.w || s.weight || ""));
    var r = parseFloat(normalizeNumberText(s.r || s.reps || ""));

    if(!isNaN(w)){
      if(!heaviest || w > heaviest.w) heaviest = {w:w,line:getSetLine(s)};
    }

    var score = 0;
    if(!isNaN(w) && !isNaN(r)){
      score = w > 0 ? w * (1 + r / 30) : r;
    }else if(!isNaN(w)){
      score = w;
    }else if(!isNaN(r)){
      score = r;
    }

    if(score > bestScore){
      bestScore = score;
      best = getSetLine(s);
    }
  });

  return "<div style='display:grid;grid-template-columns:1fr;gap:8px;'>" +
    "<div>Serie robocze: <b>" + working.length + "</b></div>" +
    "<div>Najcięższa: <b>" + esc(heaviest ? heaviest.line : "brak") + "</b></div>" +
    "<div>Najlepsza seria: <b>" + esc(best || "brak") + "</b></div></div>";
};

var exerciseTimer = null;
window.startExerciseTimer = function(sec){
  if(sec === 0){
    var v = document.getElementById("exerciseTimerCustom");
    sec = parseInt(v && v.value ? v.value : "0", 10);
  }
  if(!sec || sec <= 0) return;

  if(exerciseTimer){clearInterval(exerciseTimer); exerciseTimer = null;}

  var end = Date.now() + sec * 1000;
  var el = document.getElementById("exerciseTimer");
  if(el){
    el.innerText = fmt(sec);
    el.className = "timer running";
  }

  exerciseTimer = setInterval(function(){
    var left = Math.ceil((end - Date.now()) / 1000);
    var node = document.getElementById("exerciseTimer");
    if(!node) return;
    if(left <= 0){
      clearInterval(exerciseTimer);
      exerciseTimer = null;
      node.innerText = "GOTOWE";
      node.className = "timer ready";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }else{
      node.innerText = fmt(left);
      node.className = "timer running";
    }
  },300);
};

window.stopExerciseTimer = function(){
  if(exerciseTimer){clearInterval(exerciseTimer); exerciseTimer = null;}
  var el = document.getElementById("exerciseTimer");
  if(el){
    el.innerText = "00:00";
    el.className = "timer";
  }
};

  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var oldLast = e.reportLast || e.last || "brak";
    out += "\n" + (i+1) + ". " + e.name + "\n";
    out += "Ostatnio: " + oldLast + "\n";
    out += "Plan na dziś: " + e.plan.replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";
    out += "Zrobione:\n";
    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";
    else e.sets.forEach(function(s){out += "- " + getSetLine(s) + "\n";});
  });

  out += "\nPodsumowanie obciążenia partii:\n";
  out += volumeSummaryText(log) + "\n";
  out += "\nEND_GYMLOG_CRUSH";
  return out;
};

isBodyweightExercise = function(ex){
  if(ex && ex.bodyweight) return true;
  var n = String(ex && ex.name ? ex.name : "").toLowerCase();
  return n.indexOf("podciągan") >= 0 ||
    n.indexOf("pull-up") >= 0 ||
    n.indexOf("pull up") >= 0 ||
    n.indexOf("chin-up") >= 0 ||
    n.indexOf("chin up") >= 0 ||
    n.indexOf("dipy") >= 0 ||
    n.indexOf("pompki") >= 0 ||
    n.indexOf("dead bug") >= 0 ||
    n.indexOf("reverse crunch") >= 0 ||
    n.indexOf("heel taps") >= 0 ||
    n.indexOf("side plank") >= 0 ||
    n.indexOf("hollow") >= 0;
};

window.isSubstituteExercise = function(ex){
  return !!(ex && (ex.isSubstitute || ex.excludeProgression));
};

window.substituteOriginalName = function(ex){
  if(ex && ex.substituteOriginal && ex.substituteOriginal.name) return ex.substituteOriginal.name;
  if(ex && ex.substituteFor) return ex.substituteFor;
  return "";
};

window.parseSubGroups = function(txt, fallback){
  var arr = String(txt || "")
    .split(/[;,]/)
    .map(function(x){return x.trim();})
    .filter(function(x){return x.length > 0;});
  if(arr.length) return arr;
  return fallback && fallback.length ? fallback : ["Inne"];
};

window.applyExerciseSubstitution = function(){
  if(!current || !current.exercises || !current.exercises[idx]){ home(); return; }

  var e = current.exercises[idx];
  var newName = document.getElementById("subName").value.trim();
  var groupsText = document.getElementById("subGroups").value.trim();
  var type = document.getElementById("subType").value;
  var clearSets = document.getElementById("subClearSets").value === "TAK";

  if(!newName){ alert("Wpisz nazwę zamiennika."); return; }

  if(!e.substituteOriginal){
    e.substituteOriginal = {
      name:e.name,
      groups:e.groups || [],
      plan:e.plan || "",
      last:e.last || "",
      rest:e.rest || 120,
      bodyweight:!!e.bodyweight,
      autoRestRecord:!!e.autoRestRecord,
      timed:!!e.timed,
      exerciseTimer:!!e.exerciseTimer
    };
  }

  var original = e.substituteOriginal;

  e.name = newName;
  e.groups = window.parseSubGroups(groupsText, original.groups);
  e.plan = "ZAMIANA ĆWICZENIA\nZamienione za: " + original.name + "\nWpisuj serie według uznania.\nTa zamiana NIE będzie używana do progresji planu.\nPrzerwa bazowa: 02:00";
  e.last = "Zamiana ćwiczenia — brak podpowiedzi i brak progresji.";
  e.rest = 120;
  e.autoRestRecord = false;
  e.bodyweight = type === "bodyweight";
  e.timed = false;
  e.exerciseTimer = false;
  e.isSubstitute = true;
  e.excludeProgression = true;
  e.substituteFor = original.name;
  e.reportLast = "Zamiana ćwiczenia — nie liczona do progresji.";

  if(clearSets) e.sets = [];

  current.index = idx;
  data.draft = current;
  safeSave();
  exercise();
};

window.undoExerciseSubstitution = function(){
  if(!current || !current.exercises || !current.exercises[idx]){ home(); return; }

  var e = current.exercises[idx];
  if(!e.substituteOriginal){ exercise(); return; }

  if(e.sets && e.sets.length){
    var ok = confirm("Cofnąć zamianę i wyczyścić wpisane serie z zamiennika?");
    if(!ok) return;
  }

  var o = e.substituteOriginal;
  e.name = o.name;
  e.groups = o.groups || [];
  e.plan = o.plan || "";
  e.last = o.last || "";
  e.rest = o.rest || 120;
  e.bodyweight = !!o.bodyweight;
  e.autoRestRecord = !!o.autoRestRecord;
  e.timed = !!o.timed;
  e.exerciseTimer = !!o.exerciseTimer;
  e.sets = [];

  delete e.isSubstitute;
  delete e.excludeProgression;
  delete e.substituteFor;
  delete e.substituteOriginal;
  delete e.reportLast;

  current.index = idx;
  data.draft = current;
  safeSave();
  exercise();
};

recomputeLastByExercise = function(){
  var rebuilt = {};
  var rebuiltSets = {};

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise(e)) return;
      if(e.sets && e.sets.length){
        var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
        if(lines.length){
          rebuilt[e.name] = log.date + ": " + lines.join("; ");
          rebuiltSets[e.name] = e.sets.map(function(s){
            if(typeof s === "string") return parseSetLine(s, e);
            if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
            if(s.s) s.s = statusMapNew(s.s);
            return s;
          });
        }
      }
    });
  }

  data.lastByExercise = rebuilt;
  data.lastSetsByExercise = rebuiltSets;
  safeSave();
};

makeReport = function(log){

  out += "Data: " + log.date + "\n";
  out += "Trening: " + log.training + "\n";
  out += "Tryb testowy: " + (log.testMode ? "TAK" : "NIE") + "\n";
  out += "Sen: " + log.sleep + "\n";
  out += "Waga: " + log.weight + "\n";
  out += "Samopoczucie: " + log.mood + "\n";
  out += "Trzeszczka/paluch przy chodzeniu 0-10: " + log.footWalk + "\n";
  out += "Trzeszczka/paluch przy wybiciu 0-10: " + log.footPush + "\n";
  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var sub = window.isSubstituteExercise(e);
    out += "\n" + (i+1) + ". " + e.name + "\n";
    if(sub){
      out += "Zamiana za: " + (e.substituteFor || window.substituteOriginalName(e) || "brak") + "\n";
      out += "Do progresji: NIE — zamiana ćwiczenia\n";
      out += "Ostatnio: Zamiana ćwiczenia — brak podpowiedzi i brak progresji.\n";
    }else{
      var oldLast = e.reportLast || e.last || "brak";
      out += "Ostatnio: " + oldLast + "\n";
    }
    out += "Plan na dziś: " + String(e.plan || "").replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";
    out += "Zrobione:\n";
    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";

function safeGymV31(g){
  g = String(g || "").trim();
  return GYMS_V31.indexOf(g) >= 0 ? g : "CityFit";
}

function defaultGymForTrainingV31(training){
  training = String(training || "");
  if(training === "Nogi") return "Siłownia Oskara";
  return "CityFit";
}

function getDefaultGymV31(training){
  if(data.gymDefaults && data.gymDefaults[training]) return safeGymV31(data.gymDefaults[training]);
  return defaultGymForTrainingV31(training);
}

function getLogGymV31(log){
  if(log && log.gym) return safeGymV31(log.gym);
  return defaultGymForTrainingV31(log && log.training ? log.training : "");
}

function shouldWriteProgressV31(gym){
  return safeGymV31(gym) !== "Wyjazd";
}

function ensureGymDataV31(){
  if(!data.gymDefaults) data.gymDefaults = {};
  if(!data.lastByExerciseByGym) data.lastByExerciseByGym = {};
  if(!data.lastSetsByExerciseByGym) data.lastSetsByExerciseByGym = {};
  if(!data.planOverridesByGym) data.planOverridesByGym = {};
  GYMS_V31.forEach(function(g){
    if(!data.lastByExerciseByGym[g]) data.lastByExerciseByGym[g] = {};
    if(!data.lastSetsByExerciseByGym[g]) data.lastSetsByExerciseByGym[g] = {};
    if(!data.planOverridesByGym[g]) data.planOverridesByGym[g] = {};
  });
}

getSuggestion = function(ex){
  if(window.isSubstituteExercise && window.isSubstituteExercise(ex)) return {w:"",r:"",s:"",n:""};
  var setNo = ex.sets ? ex.sets.length : 0;
  var gym = current ? safeGymV31(current.gym || getDefaultGymV31(current.training)) : "CityFit";
  var arr = getLastSetsForGymExerciseV31(gym, ex.name);
  if(arr && arr[setNo]){
    var s = typeof arr[setNo] === "string" ? parseSetLine(arr[setNo], ex) : arr[setNo];
    if(s && s.s) s.s = statusMapNew(s.s);
    return s;
  }
  var last = getLastTextForGymExerciseV31(gym, ex.name);
  if(last){
    var parsed = parseLastTextToSets(last, ex);
    if(parsed && parsed[setNo]) return parsed[setNo];
  }
  return {w:"",r:"",s:"",n:""};
};

recomputeLastByExercise = function(){
  ensureGymDataV31();

  var globalLast = {};
  var globalSets = {};
  var byGymLast = {};
  var byGymSets = {};

  GYMS_V31.forEach(function(g){
    byGymLast[g] = {};
    byGymSets[g] = {};
  });

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    var gym = getLogGymV31(log);
    var writeProgress = shouldWriteProgressV31(gym);

    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise && window.isSubstituteExercise(e)) return;
      if(!e.sets || !e.sets.length) return;

      var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
      if(!lines.length) return;

      var normalizedSets = e.sets.map(function(s){
        if(typeof s === "string") return parseSetLine(s, e);
        if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
        if(s.s) s.s = statusMapNew(s.s);
        return s;
      });

      var text = log.date + ": " + lines.join("; ");

      if(writeProgress){
        if(!globalLast[e.name]){
          globalLast[e.name] = text;
          globalSets[e.name] = normalizedSets;
        }
        if(!byGymLast[gym]) byGymLast[gym] = {};
        if(!byGymSets[gym]) byGymSets[gym] = {};
        if(!byGymLast[gym][e.name]){
          byGymLast[gym][e.name] = text;
          byGymSets[gym][e.name] = normalizedSets;
        }
      }
    });
  }

  data.lastByExercise = globalLast;
  data.lastSetsByExercise = globalSets;
  data.lastByExerciseByGym = byGymLast;
  data.lastSetsByExerciseByGym = byGymSets;
  safeSave();
};

recomputeLastByExercise = function(){
  ensureGymDataV31();
  var globalLast={}, globalSets={}, byGymLast={}, byGymSets={};
  GYMS_V31.forEach(function(g){byGymLast[g]={};byGymSets[g]={};});
  var logs=(data.logs||[]).slice().sort(function(a,b){
    function ts(x){var v=(x&&(x.finishedAt||x.createdAt||x.date))||"";var t=Date.parse(v);return isNaN(t)?0:t;}
    return ts(b)-ts(a);
  });
  logs.forEach(function(log){
    if(!log||!log.exercises)return;
    var gym=getLogGymV31(log); if(!shouldWriteProgressV31(gym))return;
    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;
      var valid=(e.sets||[]).filter(function(s){
        var line=getSetLine(s).toLowerCase();
        return line && line.indexOf("pominięte")<0 && line.indexOf("pominiete")<0;
      });
      if(!valid.length)return;
      var lines=valid.map(function(s){return getSetLine(s);}).filter(Boolean);
      var normalized=valid.map(function(s){
        var o=typeof s==="string"?parseSetLine(s,e):JSON.parse(JSON.stringify(s));
        if(!o.line)o.line=makeSetLine(e,o.w,o.r,o.s,o.n);
        if(o.s)o.s=statusMapNew(o.s);
        o.n="";
        return o;
      });
      var text=log.date+": "+lines.join("; ");
      if(!globalLast[e.name]){globalLast[e.name]=text;globalSets[e.name]=normalized;}
      if(!byGymLast[gym][e.name]){byGymLast[gym][e.name]=text;byGymSets[gym][e.name]=normalized;}
    });
  });
  data.lastByExercise=globalLast;data.lastSetsByExercise=globalSets;
  data.lastByExerciseByGym=byGymLast;data.lastSetsByExerciseByGym=byGymSets;
  safeSave();
};

async function ghGetRemoteFileV403(){

  var url="https://api.github.com/repos/"+encodeURIComponent(GH_OWNER_V403)+"/"+
    encodeURIComponent(GH_REPO_V403)+"/contents/"+encodeURIComponent(GH_FILE_V403);

  var res=await fetch(url,{headers:ghHeadersV403(token,false),cache:"no-store"});

  if(res.status===404)return null;
  if(!res.ok)throw new Error(await ghErrorMessageV403(res));

  var file=await res.json();

  }catch(e){
    throw new Error("Plik GitHub istnieje, ale nie jest prawidłowym backupem GymLog.");

  return {sha:file.sha,payload:parsed};
}

async function ghPushV403(opts){
  opts=opts||{};
  var token=ghTokenV403();
  if(!token){
    if(!opts.silent)alert("Najpierw zapisz token GitHub w Backup.");
    return false;
  }

  if(!navigator.onLine){
    ghSetStatusV403({pending:true,lastError:"Brak internetu — synchronizacja czeka."});
    if(!opts.silent)alert("Brak internetu. Dane zostały zapisane lokalnie i synchronizacja poczeka.");
    return false;
  }

  var localCount=(data.logs||[]).length;

  if(localCount===0 && !opts.force){
    ghSetStatusV403({pending:true,lastError:"Lokalnie jest 0 treningów. Synchronizacja zablokowana ochronnie."});
    if(!opts.silent)alert("Lokalnie jest 0 treningów. Najpierw przywróć historię albo wykonaj trening — nie nadpisuję chmury pustą pamięcią.");
    return false;
  }

  ghSetStatusV403({pending:true,lastError:""});

  try{
    var remote=await ghGetRemoteFileV403();
    var remoteCount=0;

    if(remote&&remote.payload){
      var rd=remote.payload.data||remote.payload;
      remoteCount=(rd&&Array.isArray(rd.logs))?rd.logs.length:0;

      if(remoteCount>localCount && !opts.force){
        ghSetStatusV403({
          pending:true,
          lastError:"GitHub ma więcej treningów ("+remoteCount+") niż urządzenie ("+localCount+"). Najpierw pobierz dane z GitHub.",
          lastRemoteCount:remoteCount,
          lastLocalCount:localCount
        });
        if(!opts.silent){
          alert("Ochrona danych: GitHub ma "+remoteCount+" treningów, a urządzenie "+localCount+".\n\nNajpierw użyj „Pobierz dane z GitHub”, żeby nie nadpisać pełniejszej historii.");
        }
        return false;
      }
    }

    var payload=ghCloudPayloadV403();
    var body={
      message:"GymLog CRUSH backup — "+new Date().toISOString(),
      content:ghUtf8ToB64V403(JSON.stringify(payload,null,2))
    };
    if(remote&&remote.sha)body.sha=remote.sha;

    var url="https://api.github.com/repos/"+encodeURIComponent(GH_OWNER_V403)+"/"+
      encodeURIComponent(GH_REPO_V403)+"/contents/"+encodeURIComponent(GH_FILE_V403);

    var res=await fetch(url,{
      method:"PUT",
      headers:ghHeadersV403(token,true),
      body:JSON.stringify(body)
    });

    if(!res.ok)throw new Error(await ghErrorMessageV403(res));

    ghSetStatusV403({
      pending:false,
      lastSync:payload.updatedAt,
      lastError:"",
      lastRemoteCount:localCount,
      lastLocalCount:localCount
    });

    if(!opts.silent)alert("Backup GitHub zapisany.\n"+localCount+" treningów w "+GH_FILE_V403+".");
    return true;

  }catch(e){
    ghSetStatusV403({pending:true,lastError:String(e.message||e),lastLocalCount:localCount});
    if(!opts.silent)alert("Nie udało się zsynchronizować z GitHub:\n"+String(e.message||e));
    return false;
  }
}

      "Lokalnie: "+localCount+" treningów\n\n"+

    if(!data.lastSetsByExercise)data.lastSetsByExercise={};

      lastSync:wrap.updatedAt||new Date().toISOString(),
      lastError:"",
      lastRemoteCount:remoteCount,
      lastLocalCount:remoteCount
    });

    alert("Przywrócono "+remoteCount+" treningów z GitHub.");
    home();

  }catch(e){
    ghSetStatusV403({lastError:String(e.message||e)});
    alert("Nie udało się pobrać backupu z GitHub:\n"+String(e.message||e));

function luxNum(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:null;}
function luxFmt(n,d){if(n==null||!isFinite(n))return "—";return n.toFixed(d==null?1:d).replace(".",",");}
function luxAvg(field){var a=[];(data.logs||[]).forEach(function(l){var n=luxNum(l&&l[field]);if(n!=null)a.push(n);});if(!a.length)return null;return a.reduce(function(x,y){return x+y;},0)/a.length;}
function luxWorkingSetsTotal(){var n=0;(data.logs||[]).forEach(function(l){try{n+=realWorkingSetsCount(l)||0;}catch(e){}});return n;}

function luxDeltaInfo(cur,prev){

  return {

  };
}

}
function luxSetObjForScore(s,e){
  if(!s)return null;
  if(typeof s==="string")return parseSetLine(s,e);
  if((s.w==null&&s.r==null)&&s.line)return parseSetLine(s.line,e);
  return s;
}
function luxExerciseStrengthScore(ex,log){
  if(!ex||!ex.sets)return null;
  var best=null;
  (ex.sets||[]).forEach(function(raw){
    var s=luxSetObjForScore(raw,ex);
    if(!s||!isWorkingSet(s))return;
    var w=luxNum(s.w!=null?s.w:s.weight);
    var r=luxNum(s.r!=null?s.r:s.reps);
    if(r==null||r<=0)return;

    var score=null;
    if(isBodyweightExercise(ex)){
      var bw=luxNum(log&&log.weight);
      if(bw!=null){
        var effective=bw+(w==null?0:w);
        if(effective>0)score=effective*(1+r/30);
      }
      if(score==null)score=r;
    }else{
      if(w!=null&&w>0)score=w*(1+r/30);
      else if(w!=null)score=w;
      else score=r;
    }
    if(score!=null&&(best==null||score>best))best=score;
  });
  return best;
}
function luxStrengthComparisonForTraining(training){
  var logs=(data.logs||[]).filter(function(l){return l&&l.training===training;});
  if(logs.length<2)return null;

  var latest=logs[0],gym=typeof getLogGymV31==="function"?getLogGymV31(latest):(latest.gym||"");
  var previous=null;
  for(var i=1;i<logs.length;i++){
    var g=typeof getLogGymV31==="function"?getLogGymV31(logs[i]):(logs[i].gym||"");
    if(g===gym){previous=logs[i];break;}
  }
  if(!previous)previous=logs[1];
  if(!previous)return null;

  var prevBy={};
  (previous.exercises||[]).forEach(function(e){
    if(e&&e.name)prevBy[e.name]=e;
  });

  var changes=[];
  (latest.exercises||[]).forEach(function(e){
    if(!e||!e.name)return;
    if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;
    var pe=prevBy[e.name];
    if(!pe)return;
    var a=luxExerciseStrengthScore(e,latest);
    var b=luxExerciseStrengthScore(pe,previous);
    if(a==null||b==null||b<=0)return;
    var pct=((a/b)-1)*100;
    if(isFinite(pct))changes.push({name:e.name,pct:pct});
  });

  if(!changes.length)return null;

  var avg=changes.reduce(function(sum,x){return sum+x.pct;},0)/changes.length;
  var up=0,down=0,flat=0;
  changes.forEach(function(x){
    if(x.pct>1)up++;
    else if(x.pct<-1)down++;
    else flat++;
  });

  return {
    training:training,
    gym:gym,
    latest:latest,
    previous:previous,
    pct:avg,
    up:up,
    down:down,
    flat:flat,
    count:changes.length
  };
}
function luxStrengthComparisons(){
  var seen={},out=[];
  (data.logs||[]).forEach(function(l){
    if(!l||!l.training||seen[l.training])return;
    seen[l.training]=true;
    var c=luxStrengthComparisonForTraining(l.training);
    if(c)out.push(c);
  });
  return out.slice(0,6);
}
function luxStrengthClass(pct){
  if(pct>0.5)return "pos";
  if(pct<-0.5)return "neg";
  return "flat";
}
function luxSignedPct(pct){
  if(pct==null||!isFinite(pct))return "—";
  return (pct>0?"+":"")+luxFmt(pct,1)+"%";
}

/* ======================================================================
   MUSCLE LOAD MAP — 0.50.2
   Dynamic SVG heatmap based on working-set assignments from volumeSummary().
   ====================================================================== */

function luxMuscleNormKeyV502(k){
  return String(k||"").toLowerCase()
    .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e").replace(/ł/g,"l")
    .replace(/ń/g,"n").replace(/ó/g,"o").replace(/ś/g,"s").replace(/ź|ż/g,"z")
    .replace(/\s+/g," ").trim();
}

function luxMuscleLoadsV502(log){
  var raw={};
  try{ raw=volumeSummary(log)||{}; }catch(e){ raw={}; }

  var out={
    chest:0, shoulders:0, rearDelts:0, back:0, biceps:0, triceps:0,
    abs:0, quads:0, glutes:0, hamstrings:0, calves:0, erectors:0
  };

  Object.keys(raw).forEach(function(key){
    var n=Number(raw[key]||0);
    var k=luxMuscleNormKeyV502(key);

    if(k==="klatka"||k.indexOf("klatk")>=0) out.chest+=n;
    else if(k==="barki"||k==="bark"||k.indexOf("barki")>=0) out.shoulders+=n;
    else if(k.indexOf("tyl bark")>=0) out.rearDelts+=n;
    else if(k==="plecy"||k.indexOf("grzbiet")>=0) out.back+=n;
    else if(k.indexOf("biceps")>=0) out.biceps+=n;
    else if(k.indexOf("triceps")>=0) out.triceps+=n;
    else if(k.indexOf("brzuch")>=0) out.abs+=n;
    else if(k.indexOf("czwork")>=0||k.indexOf("czwor")>=0) out.quads+=n;
    else if(k.indexOf("poslad")>=0) out.glutes+=n;
    else if(k.indexOf("tyl uda")>=0||k.indexOf("dwuglow")>=0) out.hamstrings+=n;
    else if(k.indexOf("lydk")>=0) out.calves+=n;
    else if(k.indexOf("prostown")>=0) out.erectors+=n;
  });

  /* Plecy częściowo obciążają też środek/grzbiet, ale nie podbijamy tyłu barków automatycznie. */
  return out;
}

function luxMuscleLevelV502(n){
  n=Number(n||0);
  if(n<=0)return 0;
  if(n<=2)return 1;
  if(n<=4)return 2;
  if(n<=6)return 3;
  return 4;
}

function luxMuscleClassV502(n){
  var l=luxMuscleLevelV502(n);
  return l?"heat-l"+l:"";
}

function luxMuscleLevelNameV502(n){
  var l=luxMuscleLevelV502(n);
  return ["brak","niska","średnia","wysoka","bardzo wysoka"][l];
}

function luxMuscleDisplayNameV502(key){
  return {
    chest:"Klatka",shoulders:"Barki",rearDelts:"Tył barku",back:"Plecy",
    biceps:"Biceps",triceps:"Triceps",abs:"Brzuch",quads:"Czwórki",
    glutes:"Pośladek",hamstrings:"Tył uda",calves:"Łydki",erectors:"Prostowniki"
  }[key]||key;
}

function luxMuscleTopV502(loads){
  var a=Object.keys(loads).map(function(k){return {key:k,n:Number(loads[k]||0)};})
    .filter(function(x){return x.n>0;})
    .sort(function(a,b){return b.n-a.n;});
  return a.slice(0,3);
}

function luxMuscleZoneV502(key,loads){
  return "zone "+luxMuscleClassV502(loads[key]);
}

  if(!log)return "";

    var lvl=luxMuscleLevelV502(x.n);
    chips+=`<span class="lux-muscle-chip l${lvl}"><i></i>${esc(luxMuscleDisplayNameV502(x.key))}: ${x.n} ${x.n===1?"seria":"serii"} • ${esc(luxMuscleLevelNameV502(x.n))}</span>`;
  });

  if(!chips)chips=`<span class="lux-muscle-chip"><i></i>Brak serii roboczych do wizualizacji</span>`;

};

/* After finishing a workout: add the map to the generated summary screen.
   We wrap the CURRENT finishWorkout, so GitHub auto-backup remains intact. */
(function(){
  var baseFinishV502=window.finishWorkout;
  window.finishWorkout=function(){
    var snap=null;
    try{if(current)snap=JSON.parse(JSON.stringify(current));}catch(e){snap=current;}
    var result=baseFinishV502.apply(this,arguments);

    if(snap){
      try{
        var app=document.getElementById("app");
        if(app){
          var cards=app.querySelectorAll(".card");
          var map=window.muscleVisualHtml(snap);
          if(cards&&cards.length){
            cards[0].insertAdjacentHTML("afterend",map);
          }else{
            app.insertAdjacentHTML("beforeend",map);
          }
        }
      }catch(e){console.log("Muscle map finish:",e);}
    }
    return result;
  };
})();

/* History details: add the same map immediately below the workout summary. */
(function(){
  var baseDetailsV502=window.historyDetailsView;
  window.historyDetailsView=function(i,filter){
    var result=baseDetailsV502.apply(this,arguments);
    try{
      var log=data.logs&&data.logs[i];
      var app=document.getElementById("app");
      if(log&&app){
        var cards=app.querySelectorAll(".card");
        var map=window.muscleVisualHtml(log);
        if(cards&&cards.length){
          cards[0].insertAdjacentHTML("afterend",map);
        }else{
          app.insertAdjacentHTML("beforeend",map);
        }
      }
    }catch(e){console.log("Muscle map history:",e);}
    return result;
  };
})();

function glNormalizeState(d){
  if(!d||typeof d!=="object")d=glEmptyState();

async function glApi(path,opts,sessionOverride){
  opts=opts||{};
  var s=sessionOverride||glSession();
  var headers=Object.assign({"apikey":GL_SUPABASE_KEY},opts.headers||{});
  if(s&&s.access_token)headers.Authorization="Bearer "+s.access_token;
  var res=await fetch(GL_SUPABASE_URL+path,Object.assign({},opts,{headers:headers}));
  var txt=await res.text();var body=null;try{body=txt?JSON.parse(txt):null;}catch(e){body=txt;}
  if(!res.ok){var msg=(body&&body.msg)||(body&&body.message)||(body&&body.error_description)||(body&&body.error)||("HTTP "+res.status);throw new Error(msg);}
  return body;
}

async function glRefreshSession(){
  var s=glSession();if(!s||!s.refresh_token)throw new Error("Brak sesji");
  var body=await glApi("/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})},null);
  var next={access_token:body.access_token,refresh_token:body.refresh_token||s.refresh_token,expires_at:Date.now()+Number(body.expires_in||3600)*1000,user:body.user||s.user};
  glSaveSession(next);return next;
}
async function glEnsureSession(){
  var s=glSession();if(!s)return null;
  if(!navigator.onLine)return s;
  if(!s.expires_at||s.expires_at<Date.now()+90000){try{s=await glRefreshSession();}catch(e){glClearAuth();return null;}}
  return s;
}

async function glPushCloudState(){
  if(!GL_AUTH_READY||GL_CLOUD_APPLYING||!navigator.onLine)return false;
  var s=await glEnsureSession();if(!s||!s.user||!s.user.id)return false;
  var uid=s.user.id;
  glSetSync("pending","Synchronizacja…");
  try{
    var rows=await glApi("/rest/v1/user_app_state?on_conflict=user_id",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=representation"},body:JSON.stringify({user_id:uid,state:glSanitizeState(),schema_version:1,client_updated_at:new Date().toISOString()})});
    var row=Array.isArray(rows)?rows[0]:null;
    try{localStorage.setItem(glDirtyKey(uid),"0");if(row&&row.sync_revision!=null)localStorage.setItem(glRevisionKey(uid),String(row.sync_revision));}catch(e){}
    glSetSync("ok","Zsynchronizowano");return true;
  }catch(e){
    try{localStorage.setItem(glDirtyKey(uid),"1");}catch(_){} glSetSync("bad","Błąd synchronizacji");console.log("Supabase sync:",e);return false;
  }
}

async function glAfterAuthenticated(s,fromLogin){
  if(!s||!s.user||!s.user.id){glRenderLogin();return;}
  try{
    var p;
    if(navigator.onLine){p=await glFetchProfile(s.user.id);}else{p=glSavedProfile();window.GL_PROFILE=p;glApplyProfileTheme();}
    if(!p)throw new Error("Brak profilu offline");
    STORE=glUserStore(s.user.id);data=glNormalizeState(safeLoad());
    GL_AUTH_READY=true;

    if(!navigator.onLine){glSetSync("bad","Offline — dane lokalne");try{if(data.logs&&data.logs.length)recomputeLastByExercise();}catch(e){}home();return;}

    var remote=await glFetchRemoteState(s.user.id);
    var dirty=localStorage.getItem(glDirtyKey(s.user.id))==="1";
    if(dirty&&glMeaningful(data)){
      await glPushCloudState();try{if(data.logs&&data.logs.length)recomputeLastByExercise();}catch(e){}home();return;
    }

    if(glMeaningful(remote.state)){
      GL_CLOUD_APPLYING=true;data=glNormalizeState(remote.state);try{localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(glDirtyKey(s.user.id),"0");localStorage.setItem(glRevisionKey(s.user.id),String(remote.sync_revision||0));}catch(e){}GL_CLOUD_APPLYING=false;
      glSetSync("ok","Zsynchronizowano");try{if(data.logs&&data.logs.length)recomputeLastByExercise();}catch(e){}home();return;
    }

    if(glMeaningful(data)){
      await glPushCloudState();try{if(data.logs&&data.logs.length)recomputeLastByExercise();}catch(e){}home();return;
    }

    var legacy=glLegacyState();
    if(glMeaningful(legacy)){glSetSync("pending","Czeka na pierwszy import");glRenderMigration(legacy,remote);return;}

    GL_CLOUD_APPLYING=true;data=glEmptyState();try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){}GL_CLOUD_APPLYING=false;
    await glPushCloudState();home();

}

function glPlanConfigToText(cfg){
  var plans=(cfg&&cfg.managed_plans)||{},out=[];
  Object.keys(plans).forEach(function(name){
    out.push("["+name+"]");
    (plans[name]||[]).forEach(function(e){
      var row=[e.name||"",e.sets||3,e.reps||"8-12",e.rest||120,(e.groups||[]).join(",")];
      if(e.starter)row.push(e.starter);
      out.push(row.join(" | "));
    });
    out.push("");
  });
  return out.join("\n").trim();
}
function glPlanTextToConfig(txt){
  var plans={},name=null;
  String(txt||"").split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();if(!line)return;
    var m=line.match(/^\[(.+)\]$/);
    if(m){name=m[1].trim();if(!plans[name])plans[name]=[];return;}
    if(!name)throw new Error("Najpierw dodaj nazwę planu w nawiasach, np. [Plan A]");
    var p=line.split("|").map(function(x){return x.trim();});
    if(p.length<4)throw new Error("Ćwiczenie zapisz: Nazwa | serie | zakres | przerwa | partie | opcjonalnie wynik startowy");
    plans[name].push({
      name:p[0],
      sets:Math.max(1,parseInt(p[1],10)||3),
      reps:p[2]||"8-12",
      rest:Math.max(0,parseInt(p[3],10)||120),
      groups:(p[4]||"").split(",").map(function(x){return x.trim();}).filter(Boolean),
      starter:(p[5]||"").trim()
    });
  });
  return plans;
}

/* ---------- pure recompute helper for an OTHER user's state ---------- */
function glAdminRecomputeManagedState(st){
  st=glNormalizeState(st||{});var last={},lastSets={};
  (st.logs||[]).forEach(function(log){
    if(!log||!Array.isArray(log.exercises))return;
    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;
      if(last[e.name])return;
      var valid=(e.sets||[]).filter(function(s){
        var line=String(getSetLine(s)||"").toLowerCase();
        return line&&line.indexOf("pominięte")<0&&line.indexOf("pominiete")<0;
      });
      if(!valid.length)return;
      last[e.name]=(log.date||"")+": "+valid.map(function(s){return getSetLine(s);}).join("; ");
      lastSets[e.name]=valid.map(function(s){
        var o=typeof s==="string"?parseSetLine(s,e):JSON.parse(JSON.stringify(s));
        if(!o.line)o.line=makeSetLine(e,o.w,o.r,o.s,o.n);
        return o;
      });
    });
  });
  st.lastByExercise=last;st.lastSetsByExercise=lastSets;
  return st;
}

/* If an admin changes another user's cloud history while that user's app is closed/backgrounded,
   pull the newer cloud revision the next time the managed app becomes visible. */
window.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||!GL_AUTH_READY||!glIsManagedUser()||current||!navigator.onLine)return;
  (async function(){
    try{
      var s=await glEnsureSession();if(!s||!s.user)return;
      var dirty=localStorage.getItem(glDirtyKey(s.user.id))==="1";if(dirty)return;
      var remote=await glFetchRemoteState(s.user.id),localRev=Number(localStorage.getItem(glRevisionKey(s.user.id))||0);
      if(Number(remote.sync_revision||0)>localRev){
        GL_CLOUD_APPLYING=true;data=glNormalizeState(remote.state||{});
        localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(glDirtyKey(s.user.id),"0");localStorage.setItem(glRevisionKey(s.user.id),String(remote.sync_revision||0));
        GL_CLOUD_APPLYING=false;glSetSync("ok","Zsynchronizowano");home();
      }
    }catch(e){console.log("Cloud revision refresh:",e);}
  })();
});

/* Better starter parser: supports both old syntax and different weight per set,
   e.g. "80 kg: 10, 75 kg: 10,10,10". */
glManagedStarterSets=function(starter,count){
  starter=String(starter||"").trim();count=Math.max(1,Number(count||3));
  if(!starter)return [];
  var marks=[],rx=/([0-9]+(?:[.,][0-9]+)?)\s*kg\s*:/gi,m;
  while((m=rx.exec(starter))){
    marks.push({w:String(m[1]).replace(",","."),start:m.index,end:rx.lastIndex});
  }
  if(marks.length){
    var out=[];
    marks.forEach(function(mark,i){
      var end=i+1<marks.length?marks[i+1].start:starter.length;
      var chunk=starter.slice(mark.end,end).replace(/^[,;\s]+|[,;\s]+$/g,"");
      var reps=chunk.match(/[0-9]+/g)||[];
      reps.forEach(function(r){out.push({w:mark.w,r:String(r),_starter:true});});
    });
    if(out.length)return out.slice(0,count);
  }
  var only=starter.match(/([0-9]+(?:[.,][0-9]+)?)\s*kg/i);
  if(only){
    var w=String(only[1]).replace(",",".");
    var arr=[];for(var j=0;j<count;j++)arr.push({w:w,r:"",_starter:true});
    return arr;
  }
  return [];
};

/* ---------- 0.65: weight statistics include quick-saved measurements ---------- */
var gl065BaseLuxFieldPair=luxFieldPair;
var gl065BaseLuxAvg=luxAvg;
function gl065WeightSeries(){
  var byDate={};
  (data.logs||[]).forEach(function(l){
    var n=luxNum(l&&l.weight),d=String(l&&l.date||"").trim();
    if(n==null||!d)return;
    if(!byDate[d])byDate[d]={n:n,log:{date:d},source:"workout"};
  });
  (data.bodyMeasurements||[]).forEach(function(m){
    var n=luxNum(m&&m.weight),d=String(m&&m.date||"").trim();
    if(n==null||!d)return;
    byDate[d]={n:n,log:{date:d},source:"measurement"};
  });
  return Object.keys(byDate).sort(function(a,b){return b.localeCompare(a);}).map(function(d){return byDate[d];});
}
luxFieldPair=function(field){
  if(field!=="weight")return gl065BaseLuxFieldPair(field);
  var vals=gl065WeightSeries();
  return {cur:vals[0]||null,prev:vals[1]||null};
};
luxAvg=function(field){
  if(field!=="weight")return gl065BaseLuxAvg(field);
  var vals=gl065WeightSeries();if(!vals.length)return null;
  return vals.reduce(function(sum,x){return sum+x.n;},0)/vals.length;
};

/* ======================================================================
   0.66.0 — transparent workout summary PNG
   Generated entirely in-browser on a transparent Canvas.
   No screenshot library, no background card, no external graphics.
   ====================================================================== */
function gl066Num(v){
  var n=parseFloat(String(v==null?"":v).replace(",","."));
  return isFinite(n)?n:null;
}
function gl066DurationText(log){
  if(!log||!log.createdAt||!log.finishedAt)return "—";
  var a=new Date(log.createdAt).getTime(),b=new Date(log.finishedAt).getTime();
  if(!isFinite(a)||!isFinite(b)||b<a)return "—";
  var sec=Math.max(0,Math.round((b-a)/1000));
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function gl066PreviousComparableLog(log,logs,index){
  logs=Array.isArray(logs)?logs:[];
  var training=String(log&&log.training||"");
  var gym=String((typeof getLogGymV31==="function"?getLogGymV31(log):(log&&log.gym))||"");
  var fallback=null;
  for(var j=Number(index)+1;j<logs.length;j++){
    var x=logs[j];if(!x||String(x.training||"")!==training)continue;
    if(!fallback)fallback=x;
    var gx=String((typeof getLogGymV31==="function"?getLogGymV31(x):x.gym)||"");
    if(!gym||!gx||gx===gym)return x;
  }
  return fallback;
}
function gl066ProgressPct(log,logs,index){
  var prev=gl066PreviousComparableLog(log,logs,index);
  if(!prev)return null;
  var prevBy={};
  (prev.exercises||[]).forEach(function(e){if(e&&e.name)prevBy[e.name]=e;});
  var changes=[];
  (log.exercises||[]).forEach(function(e){
    if(!e||!e.name)return;
    if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;
    var pe=prevBy[e.name];if(!pe)return;
    var a=(typeof luxExerciseStrengthScore==="function")?luxExerciseStrengthScore(e,log):null;
    var b=(typeof luxExerciseStrengthScore==="function")?luxExerciseStrengthScore(pe,prev):null;
    if(a==null||b==null||b<=0)return;
    var pct=((a/b)-1)*100;if(isFinite(pct))changes.push(pct);
  });
  if(!changes.length)return null;
  return changes.reduce(function(a,b){return a+b;},0)/changes.length;
}
function gl066MusclePercentages(log){
  var raw={};
  try{raw=volumeSummary(log)||{};}catch(e){}
  var total=0;Object.keys(raw).forEach(function(k){total+=Number(raw[k]||0);});
  if(total<=0)return [];
  return Object.keys(raw).map(function(k){
    return {name:k,value:Number(raw[k]||0),pct:Number(raw[k]||0)/total*100};
  }).filter(function(x){return x.value>0;}).sort(function(a,b){
    if(b.pct!==a.pct)return b.pct-a.pct;
    return String(a.name).localeCompare(String(b.name),"pl");
  });
}
function gl066Accent(profile){
  var cfg=(profile&&profile.profile_config)||{};
  return cfg.gender==="female"?"#ffb1d2":"#ff3347";
}
function gl066ProgressColor(pct){
  if(pct==null)return "#ffffff";
  if(pct>0.05)return "#63f58a";
  if(pct<-0.05)return "#ff5b6d";
  return "#ffffff";
}
function gl066PctText(n,signed){
  if(n==null||!isFinite(n))return "—";
  var v=(signed&&n>0?"+":"")+n.toFixed(1).replace(".",",")+"%";
  return v;
}
function gl066CanvasText(ctx,text,x,y,size,weight,align,color,maxWidth){
  ctx.save();
  ctx.font=(weight||800)+" "+size+"px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif";
  ctx.textAlign=align||"center";
  ctx.textBaseline="middle";
  ctx.lineJoin="round";
  ctx.lineWidth=Math.max(3,Math.round(size*0.065));
  ctx.strokeStyle="rgba(0,0,0,.62)";
  ctx.strokeText(String(text),x,y,maxWidth);
  ctx.fillStyle=color||"#fff";
  ctx.fillText(String(text),x,y,maxWidth);
  ctx.restore();
}
function gl066FitText(ctx,text,maxWidth,startSize,minSize,weight){
  var s=startSize;
  while(s>minSize){
    ctx.font=(weight||900)+" "+s+"px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif";
    if(ctx.measureText(String(text)).width<=maxWidth)break;
    s-=2;
  }
  return s;
}
function gl066DrawMiniLogo(ctx,cx,cy,accent){
  ctx.save();
  ctx.strokeStyle=accent;ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(cx-84,cy);ctx.lineTo(cx+84,cy);ctx.stroke();
  [[-96,-84],[-108,-96],[84,96],[96,108]].forEach(function(p){
    ctx.beginPath();ctx.moveTo(cx+p[0],cy-13);ctx.lineTo(cx+p[0],cy+13);ctx.stroke();
  });
  gl066CanvasText(ctx,"GC",cx,cy,50,950,"center","#ffffff",150);
  ctx.restore();
}
function gl066SanitizeFileName(s){
  return String(s||"trening").replace(/[ąćęłńóśźż]/gi,function(c){
    var m={"ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z"};
    return m[c.toLowerCase()]||c;
  }).replace(/[^a-z0-9_-]+/gi,"-").replace(/^-+|-+$/g,"").slice(0,60)||"trening";
}
async function gl066DownloadTransparentSummary(log,logs,index,profile){
  if(!log)return;
  var W=1080,H=1350,canvas=document.createElement("canvas");
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext("2d",{alpha:true});
  ctx.clearRect(0,0,W,H);

  var accent=gl066Accent(profile||window.GL_PROFILE||{});
  var progress=gl066ProgressPct(log,logs,index);
  var muscles=gl066MusclePercentages(log);
  var duration=gl066DurationText(log);

  // Workout name.
  var title=String(log.training||"TRENING").toUpperCase();
  var titleSize=gl066FitText(ctx,title,860,66,38,950);
  gl066CanvasText(ctx,title,W/2,100,titleSize,950,"center","#ffffff",900);
  ctx.save();ctx.strokeStyle=accent;ctx.lineWidth=5;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(350,154);ctx.lineTo(730,154);ctx.stroke();ctx.restore();

  // Time.
  gl066CanvasText(ctx,"CZAS TRENINGU",W/2,230,25,850,"center","rgba(255,255,255,.92)",700);
  gl066CanvasText(ctx,duration,W/2,300,73,950,"center","#ffffff",900);

  // Progress.
  gl066CanvasText(ctx,"PROGRES",W/2,410,25,850,"center","rgba(255,255,255,.92)",600);
  gl066CanvasText(ctx,gl066PctText(progress,true),W/2,480,72,950,"center",gl066ProgressColor(progress),800);

  // Minimal central logo.
  gl066DrawMiniLogo(ctx,W/2,600,accent);

  // Muscle load.
  gl066CanvasText(ctx,"OBCIĄŻENIE",W/2,700,25,850,"center","rgba(255,255,255,.92)",600);
  ctx.save();ctx.strokeStyle=accent;ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(435,742);ctx.lineTo(645,742);ctx.stroke();ctx.restore();

  if(!muscles.length){
    gl066CanvasText(ctx,"BRAK DANYCH",W/2,825,34,850,"center","rgba(255,255,255,.78)",700);
  }else{
    var maxRows=Math.min(muscles.length,12);
    var startY=805,rowGap=maxRows>8?43:50;
    for(var i=0;i<maxRows;i++){
      var m=muscles[i],y=startY+i*rowGap;
      var label=String(m.name||"").toUpperCase();
      var ls=gl066FitText(ctx,label,500,31,22,900);
      gl066CanvasText(ctx,label,100,y,ls,900,"left","#ffffff",500);
      gl066CanvasText(ctx,gl066PctText(m.pct,false),980,y,32,950,"right","#ffffff",250);
      ctx.save();ctx.strokeStyle="rgba(255,255,255,.26)";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(420,y);ctx.lineTo(820,y);ctx.stroke();
      ctx.strokeStyle=accent;ctx.lineWidth=4;
      var x2=420+400*Math.max(0,Math.min(1,m.pct/100));
      ctx.beginPath();ctx.moveTo(420,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();
    }
  }

  var blob=await new Promise(function(resolve){canvas.toBlob(resolve,"image/png",1);});
  if(!blob){alert("Nie udało się wygenerować PNG.");return;}
  var fname="GymLog-"+gl066SanitizeFileName(log.training)+"-"+gl066SanitizeFileName(log.date)+".png";
  var file;
  try{file=new File([blob],fname,{type:"image/png"});}catch(e){file=null;}

  // Standard download first. On iOS/Safari this opens the native save/share flow.
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=fname;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},30000);
}

/* ======================================================================
   0.67.0 — FINAL MINIMAL TRANSPARENT SHARE DESIGN
   Exact implementation direction approved in chat:
   transparent background, no panels, no red borders, no logo,
   only clean typography, glow accents and slim load bars.

function gl067RoundRect(ctx,x,y,w,h,r){
  var rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function gl067Text(ctx,text,x,y,size,weight,align,color,shadowColor,shadowBlur,maxWidth,letterSpacing){
  ctx.save();
  ctx.font=(weight||800)+" "+size+"px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif";
  ctx.textAlign=align||"center";
  ctx.textBaseline="middle";
  ctx.fillStyle=color||"#fff";
  ctx.shadowColor=shadowColor||"rgba(0,0,0,.75)";
  ctx.shadowBlur=shadowBlur==null?10:shadowBlur;
  ctx.shadowOffsetY=2;
  if(letterSpacing && letterSpacing>0){
    var chars=String(text).split("");
    var widths=chars.map(function(ch){return ctx.measureText(ch).width;});
    var total=widths.reduce(function(a,b){return a+b;},0)+letterSpacing*Math.max(0,chars.length-1);
    var cx=x;
    if((align||"center")==="center")cx=x-total/2;
    else if((align||"center")==="right")cx=x-total;
    ctx.textAlign="left";
    chars.forEach(function(ch,i){
      ctx.fillText(ch,cx,y,maxWidth);
      cx+=widths[i]+letterSpacing;
    });
  }else{
    ctx.fillText(String(text),x,y,maxWidth);
  }
  ctx.restore();
}
function gl067GlowLine(ctx,x1,y1,x2,y2,color,width,blur){
  ctx.save();
  ctx.lineCap="round";
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.shadowColor=color;
  ctx.shadowBlur=blur;
  ctx.beginPath();
  ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.restore();
}
function gl067Arrow(ctx,x,y,size,color){
  ctx.save();
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.lineWidth=Math.max(8,size*.13);
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.shadowColor=color;
  ctx.shadowBlur=24;
  ctx.beginPath();
  ctx.moveTo(x-size*.35,y+size*.2);
  ctx.lineTo(x+size*.1,y-size*.25);
  ctx.lineTo(x+size*.1,y+size*.02);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-size*.02,y-size*.33);
  ctx.lineTo(x+size*.37,y-size*.33);
  ctx.lineTo(x+size*.37,y+size*.06);
  ctx.lineTo(x+size*.22,y-.08*size);
  ctx.lineTo(x+size*.22,y-size*.17);
  ctx.lineTo(x+size*.1,y-size*.17);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function gl067Bar(ctx,x,y,w,h,pct,accent){
  pct=Math.max(0,Math.min(100,Number(pct||0)));
  ctx.save();
  // Neutral rail - subtle enough to work on light/dark photos.
  ctx.shadowColor="rgba(0,0,0,.6)";
  ctx.shadowBlur=6;
  ctx.fillStyle="rgba(255,255,255,.22)";
  gl067RoundRect(ctx,x,y,w,h,h/2);
  ctx.fill();

  // Filled part.
  var fw=Math.max(h,pct/100*w);
  ctx.shadowColor=accent;
  ctx.shadowBlur=14;
  var grad=ctx.createLinearGradient(x,y,x+fw,y);
  grad.addColorStop(0,accent);
  grad.addColorStop(1,accent);
  ctx.fillStyle=grad;
  gl067RoundRect(ctx,x,y,fw,h,h/2);
  ctx.fill();
  ctx.restore();
}
function gl067FitSize(ctx,text,maxWidth,start,min,weight){
  var s=start;
  while(s>min){
    ctx.font=(weight||900)+" "+s+"px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif";
    if(ctx.measureText(String(text)).width<=maxWidth)break;
    s-=2;
  }
  return s;
}
function gl067ShareHeight(muscleCount){
  // Three rows reproduce the approved 1080×1350 composition.
  // More rows grow the transparent canvas instead of squeezing the design.
  return 1350 + Math.max(0,muscleCount-3)*92;
}
async function gl066DownloadTransparentSummary(log,logs,index,profile){
  if(!log)return;

  var muscles=gl066MusclePercentages(log);
  var W=1080,H=gl067ShareHeight(muscles.length);
  var canvas=document.createElement("canvas");
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext("2d",{alpha:true});
  ctx.clearRect(0,0,W,H);

  var accent=gl066Accent(profile||window.GL_PROFILE||{});
  var progress=gl066ProgressPct(log,logs,index);
  var progressColor=gl066ProgressColor(progress);
  var duration=gl066DurationText(log);

  // ===== HEADER =====
  var title=String(log.training||"TRENING").toUpperCase();
  var titleSize=gl067FitSize(ctx,title,840,72,42,950);
  gl067Text(ctx,title,W/2,120,titleSize,950,"center","#ffffff","rgba(0,0,0,.85)",18,880,0);
  gl067GlowLine(ctx,360,185,720,185,accent,6,18);

  // ===== TIME =====
  gl067Text(ctx,"CZAS TRENINGU",W/2,275,28,850,"center","rgba(255,255,255,.96)","rgba(0,0,0,.85)",12,720,7);
  gl067Text(ctx,duration,W/2,365,82,950,"center","#ffffff","rgba(0,0,0,.90)",20,900,0);

  // ===== PROGRESS =====
  gl067Text(ctx,"PROGRES",W/2,505,28,850,"center","rgba(255,255,255,.96)","rgba(0,0,0,.85)",12,560,8);

  var progressText=gl066PctText(progress,true);
  if(progress==null){
    gl067Text(ctx,"—",W/2,595,82,950,"center","#ffffff","rgba(0,0,0,.9)",20,700,0);
  }else{
    gl067Arrow(ctx,365,598,66,progressColor);
    gl067Text(ctx,progressText,585,595,82,950,"center",progressColor,"rgba(0,0,0,.84)",22,650,0);
  }

  // ===== LOAD =====
  gl067Text(ctx,"OBCIĄŻENIE",W/2,770,28,850,"center","rgba(255,255,255,.96)","rgba(0,0,0,.85)",12,650,8);

  if(!muscles.length){
    gl067Text(ctx,"BRAK DANYCH",W/2,880,34,850,"center","rgba(255,255,255,.82)","rgba(0,0,0,.8)",10,700,2);
  }else{
    var startY=860;
    var rowGap=92;
    var nameX=100,barX=335,barW=450,pctX=978;
    muscles.forEach(function(m,i){
      var y=startY+i*rowGap;
      var label=String(m.name||"").toUpperCase();
      var nameSize=gl067FitSize(ctx,label,210,34,24,900);
      gl067Text(ctx,label,nameX,y,nameSize,900,"left","#ffffff","rgba(0,0,0,.92)",12,220,0);
      gl067Bar(ctx,barX,y-9,barW,18,m.pct,accent);
      gl067Text(ctx,gl066PctText(m.pct,false),pctX,y,34,950,"right","#ffffff","rgba(0,0,0,.92)",12,170,0);
    });
  }

  // Clean transparent PNG export.
  var blob=await new Promise(function(resolve){canvas.toBlob(resolve,"image/png",1);});
  if(!blob){alert("Nie udało się wygenerować PNG.");return;}
  var fname="GymLog-"+gl066SanitizeFileName(log.training)+"-"+gl066SanitizeFileName(log.date)+".png";
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=fname;a.style.display="none";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},30000);
}
