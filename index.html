function safeLoad(){

    if(!d.logs) d.logs = [];
    if(!d.lastByExercise) d.lastByExercise = {};
    if(!d.lastSetsByExercise) d.lastSetsByExercise = {};
    if(!d.lastMeta) d.lastMeta = {};
    if(!d.planOverrides) d.planOverrides = {};
    if(!d.appUpdates) d.appUpdates = [];
    if(!("draft" in d)) d.draft = null;
    return d;
  }catch(e){
    return {logs:[],lastByExercise:{},lastSetsByExercise:{},lastMeta:{},draft:null,planOverrides:{},appUpdates:[],storageError:String(e)};
  }
}

function isBodyweightExercise(ex){
  if(ex && ex.bodyweight) return true;
  var n = String(ex && ex.name ? ex.name : "").toLowerCase();
  return n.indexOf("podciągan") >= 0 || n.indexOf("dipy") >= 0 || n.indexOf("dip") >= 0 || n.indexOf("pompki") >= 0 || n.indexOf("pull-up") >= 0 || n.indexOf("pull up") >= 0 || n.indexOf("chin-up") >= 0 || n.indexOf("chin up") >= 0;
}

function normalizeNumberText(x){return String(x || "").trim().replace(",", ".");}

function displayNumber(x){
  return String(x || "").replace(".", ",");
}

function prettyBodyweightLoad(raw){
  var t = String(raw || "").trim();
  if(t === "") return "masa ciała";
  var n = parseFloat(normalizeNumberText(t));
  if(isNaN(n)) return t;
  if(n === 0) return "masa ciała";
  if(n > 0) return "masa ciała +" + t + " kg";
  return "asysta " + String(Math.abs(n)).replace(".", ",") + " kg";
}

function makeSetLine(ex,w,r,s,n){
  var line = "";
  if(isBodyweightExercise(ex)){
    if(w || r) line += prettyBodyweightLoad(w);
  }else{
    if(w) line += w + " kg";
  }
  if(r) line += (line ? " x " : "x ") + r;
  if(s) line += " — " + s;
  if(n) line += " | " + n;
  return line;
}

function getSetLine(s){
  if(!s) return "";
  if(typeof s === "string") return s;
  return s.line || "";
}

function parseSetLine(line, ex){
  var raw = String(line || "").trim();
  var out = {line:raw,w:"",r:"",s:"",n:""};

  if(!raw) return out;

  var lower = raw.toLowerCase();
  if(lower.indexOf("pominięte") >= 0 || lower.indexOf("pominiete") >= 0){
    out.s = "pominięte";
    var partsSkip = raw.split("—");
    if(partsSkip[1]) out.n = partsSkip[1].trim();
    return out;
  }

  var noteParts = raw.split("|");
  if(noteParts.length > 1){
    out.n = noteParts.slice(1).join("|").trim();
    raw = noteParts[0].trim();
  }

  var statusParts = raw.split("—");
  if(statusParts.length > 1){
    out.s = statusParts.slice(1).join("—").trim();
    raw = statusParts[0].trim();
  }

  var repMatch = raw.match(/x\s*([0-9]+(?:[\-,][0-9]+)?)/i);
  if(repMatch) out.r = repMatch[1].trim();

  if(isBodyweightExercise(ex)){
    if(raw.toLowerCase().indexOf("masa ciała") >= 0 || raw.toLowerCase().indexOf("masa ciala") >= 0){
      var plusMatch = raw.match(/\+\s*([0-9]+(?:[\.,][0-9]+)?)/);
      out.w = plusMatch ? displayNumber(plusMatch[1]) : "0";
    }else if(raw.toLowerCase().indexOf("asysta") >= 0){
      var assistMatch = raw.match(/asysta\s*([0-9]+(?:[\.,][0-9]+)?)/i);
      out.w = assistMatch ? "-" + displayNumber(assistMatch[1]) : "";
    }else{
      var bwKg = raw.match(/([0-9]+(?:[\.,][0-9]+)?)\s*kg/i);
      out.w = bwKg ? displayNumber(bwKg[1]) : "";
    }
  }else{
    var kgMatch = raw.match(/([0-9]+(?:[\.,][0-9]+)?)\s*kg/i);
    out.w = kgMatch ? displayNumber(kgMatch[1]) : "";
  }

  return out;
}

function parseLastTextToSets(text, ex){
  var t = String(text || "").trim();
  if(!t) return [];

  var colon = t.indexOf(":");
  if(colon >= 0 && colon < 25){
    var prefix = t.slice(0, colon).toLowerCase();
    if(/[0-9]/.test(prefix) || prefix.indexOf("202") >= 0 || prefix.indexOf(".") >= 0){
      t = t.slice(colon + 1).trim();
    }
  }

  var parts = t.split(";").map(function(x){return x.trim();}).filter(function(x){return x.length > 0;});
  if(!parts.length && t) parts = [t];

  return parts.map(function(line){return parseSetLine(line, ex);}).filter(function(s){
    return s.line && s.line.toLowerCase().indexOf("brak") < 0;
  });
}

function isWorkingSet(s){
  var line = getSetLine(s).toLowerCase();
  if(!line) return false;
  if(line.indexOf("rozgrzewka") >= 0) return false;
  if(line.indexOf("pominięte") >= 0) return false;
  if(line.indexOf("pominiete") >= 0) return false;
  return true;
}

function getRecordRestByWeight(w){
  var n = parseFloat(normalizeNumberText(w));
  if(isNaN(n)) return 180;
  if(n <= 85) return 120;
  if(n < 95) return 180;
  return 300;
}

function getRestForSet(ex,w){
  if(ex && ex.autoRestRecord) return getRecordRestByWeight(w);
  return ex.rest || 120;
}

function restDescription(ex){
  if(ex && ex.autoRestRecord) return "Automatyczna:\n≤85 kg = 02:00\n>85 kg = 03:00\n≥95 kg = 05:00";
  return fmt(ex.rest);
}

function restDescriptionReport(ex){
  if(ex && ex.autoRestRecord) return "Automatyczna: ≤85 kg = 02:00 / >85 kg = 03:00 / ≥95 kg = 05:00";
  return fmt(ex.rest);
}

function getSuggestion(ex){
  var setNo = ex.sets ? ex.sets.length : 0;
  var arr = data.lastSetsByExercise && data.lastSetsByExercise[ex.name] ? data.lastSetsByExercise[ex.name] : null;

  if(arr && arr[setNo]){
    if(typeof arr[setNo] === "string") return parseSetLine(arr[setNo], ex);
    return arr[setNo];
  }

  var lastText = data.lastByExercise && data.lastByExercise[ex.name] ? data.lastByExercise[ex.name] : "";
  if(lastText){
    var parsed = parseLastTextToSets(lastText, ex);
    if(parsed && parsed[setNo]) return parsed[setNo];
  }

  return {w:"",r:"",s:"",n:""};
}

function volumeSummary(log){
  var volume = {};
  if(!log || !log.exercises) return volume;

  log.exercises.forEach(function(e){
    var groups = e.groups || [];
    if(!groups.length) groups = ["Inne"];

    var count = 0;
    (e.sets || []).forEach(function(s){
      if(isWorkingSet(s)) count++;
    });

    if(count > 0){
      groups.forEach(function(g){
        if(!volume[g]) volume[g] = 0;
        volume[g] += count;
      });
    }
  });

  return volume;
}

function volumeSummaryText(log){
  var v = volumeSummary(log);
  var keys = Object.keys(v);
  if(!keys.length) return "Brak serii roboczych.";
  keys.sort();
  return keys.map(function(k){return k + ": " + v[k] + " serii";}).join("\n");
}

function recomputeLastByExercise(){
  var rebuilt = {};
  var rebuiltSets = {};

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    log.exercises.forEach(function(e){
      if(e.sets && e.sets.length){
        var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
        if(lines.length){
          rebuilt[e.name] = log.date + ": " + lines.join("; ");
          rebuiltSets[e.name] = e.sets.map(function(s){
            if(typeof s === "string") return parseSetLine(s, e);
            if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
            return s;
          });
        }
      }
    });
  }

  data.lastByExercise = rebuilt;
  data.lastSetsByExercise = rebuiltSets;
  safeSave();
}

function startRest(sec){
  stopTimer();
  var end = Date.now() + sec * 1000;

  timer = setInterval(function(){
    var left = Math.ceil((end - Date.now()) / 1000);
    var el = document.getElementById("timer");
    if(!el) return;

    if(left <= 0){
      stopTimer();
      el.innerText = "GOTOWE";
      el.className = "timer ready";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }else{
      el.innerText = fmt(left);
      el.className = "timer running";
    }
  },300);
}

function makeReport(log){
  var out = "";
  out += "GYMLOG_CRUSH_V2.7\n";
  out += "Data: " + log.date + "\n";
  out += "Trening: " + log.training + "\n";
  out += "Tryb testowy: " + (log.testMode ? "TAK" : "NIE") + "\n";
  out += "Sen: " + log.sleep + "\n";
  out += "Waga: " + log.weight + "\n";
  out += "Samopoczucie: " + log.mood + "\n";
  out += "Trzeszczka/paluch przy chodzeniu 0-10: " + log.footWalk + "\n";
  out += "Trzeszczka/paluch przy wybiciu 0-10: " + log.footPush + "\n";
  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var oldLast = e.reportLast || e.last || "brak";
    out += "\n" + (i+1) + ". " + e.name + "\n";
    out += "Ostatnio: " + oldLast + "\n";
    out += "Plan na dziś: " + e.plan.replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";

    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";
    else e.sets.forEach(function(s){out += "- " + getSetLine(s) + "\n";});
  });

  out += "\nPodsumowanie serii roboczych na partie:\n";
  out += volumeSummaryText(log) + "\n";
  out += "\nEND_GYMLOG_CRUSH";
  return out;
}

window.applyGoalsUpdate = function(){

  result.items.forEach(function(item){

    data.planOverrides[item.plan][item.exercise] = item.goal;
  });

  safeSave();

  var msg = "Zaktualizowano cele:\n" + result.items.map(function(x){
    return x.plan + " — " + x.exercise;
  }).join("\n");

  render("<h1>Aktualizuj cele</h1><div class='badge'>" + VERSION + "</div><div class='ok'>" + esc(msg) + "</div><button onclick='home()'>Menu</button>");
};

function parseGoalUpdate(txt){
  var lines = String(txt || "").split(/\r?\n/);
  var items = [];
  var currentPlan = null;
  var currentExercise = null;
  var buf = [];

  function flush(){
    if(currentPlan && currentExercise && buf.length){
      items.push({plan:currentPlan,exercise:currentExercise,goal:buf.join("\n").trim()});
    }
    currentExercise = null;
    buf = [];
  }

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;
    if(line === "GYMLOG_PLAN_UPDATE_V1") continue;
    if(line === "END_UPDATE"){
      flush();
      break;
    }

    if(PLANS[line]){
      flush();
      currentPlan = line;
      continue;
    }

    if(line.endsWith(":")){
      flush();
      if(!currentPlan){
        return {ok:false,message:"Błąd: najpierw podaj nazwę planu, np. Day 1 PUSH."};
      }
      currentExercise = line.slice(0,-1).trim();
      continue;
    }

    if(currentPlan && currentExercise){
      buf.push(line);
    }
  }

  flush();

  if(!items.length){
    return {ok:false,message:"Nie znaleziono żadnych celów do aktualizacji. Sprawdź format bloku."};
  }

  var errors = [];
  items.forEach(function(item){
    var found = false;
    (PLANS[item.plan] || []).forEach(function(e){
      if(e.name === item.exercise) found = true;
    });
    if(!found) errors.push(item.plan + " — nie znaleziono ćwiczenia: " + item.exercise);
  });

  if(errors.length){
    return {ok:false,message:"Błąd nazw ćwiczeń:\n" + errors.join("\n")};
  }

  return {ok:true,items:items};
}

function parseAppUpdate(txt){
  var raw = String(txt || "");
  if(raw.indexOf("GYMLOG_APP_UPDATE_V1") < 0) return {ok:false,message:"Brak nagłówka GYMLOG_APP_UPDATE_V1."};
  if(raw.indexOf("END_APP_UPDATE") < 0) return {ok:false,message:"Brak końcówki END_APP_UPDATE."};

  var idMatch = raw.match(/ID:\s*(.+)/);
  var verMatch = raw.match(/WERSJA:\s*(.+)/);
  var codeStart = raw.indexOf("KOD:");
  var codeEnd = raw.lastIndexOf("END_APP_UPDATE");

  if(!idMatch) return {ok:false,message:"Brak ID poprawki."};
  if(codeStart < 0) return {ok:false,message:"Brak sekcji KOD:."};

  var code = raw.slice(codeStart + 4, codeEnd).trim();
  if(!code) return {ok:false,message:"Sekcja KOD jest pusta."};

  return {
    ok:true,
    id:idMatch[1].trim(),
    version:verMatch ? verMatch[1].trim() : "",
    code:code
  };
}

window.applyAppUpdate = function(){
  var txt = document.getElementById("appUpdateText").value;
  var parsed = parseAppUpdate(txt);

  if(!parsed.ok){
    render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='err'>" + esc(parsed.message) + "</div><button class='secondary' onclick='appUpdateView()'>Wróć</button>");
    return;
  }

  try{
    eval(parsed.code);
  }catch(e){
    render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='err'>Patch nie został zainstalowany, bo kod ma błąd:\n" + esc(String(e)) + "</div><button class='secondary' onclick='appUpdateView()'>Wróć</button>");
    return;
  }

  if(!data.appUpdates) data.appUpdates = [];
  data.appUpdates = data.appUpdates.filter(function(u){return u.id !== parsed.id;});
  data.appUpdates.push({
    id:parsed.id,
    version:parsed.version,
    code:parsed.code,
    installedAt:new Date().toISOString()
  });

  safeSave();

  render("<h1>Aktualizuj aplikację</h1><div class='badge'>" + VERSION + "</div><div class='ok'>Zainstalowano poprawkę:\n" + esc(parsed.id) + "\nWersja: " + esc(parsed.version || "-") + "</div><button onclick='home()'>Menu</button>");
};

isWorkingSet = function(s){
  var line = getSetLine(s).toLowerCase();
  var st = String((s && (s.s || s.status)) || "").toLowerCase();
  if(!line) return false;
  if(line.indexOf("rozgrzewka") >= 0 || st === "rozgrzewka") return false;
  if(line.indexOf("pominięte") >= 0 || line.indexOf("pominiete") >= 0 || st.indexOf("pomini") >= 0) return false;
  if(line.indexOf("fail") >= 0 || st === "fail") return false;
  if(line.indexOf("ból / przerwane") >= 0 || line.indexOf("bol / przerwane") >= 0 || st.indexOf("przerwane") >= 0) return false;
  return true;
};

window.realWorkingSetsCount = function(log){
  var total = 0;
  if(!log || !log.exercises) return 0;
  log.exercises.forEach(function(e){
    (e.sets || []).forEach(function(s){
      if(isWorkingSet(s)) total++;
    });
  });
  return total;
};

volumeSummaryText = function(log){
  var v = volumeSummary(log);
  var keys = Object.keys(v);
  var realTotal = realWorkingSetsCount(log);

  if(!keys.length){
    return "Realnie wykonane: " + realTotal + " serii roboczych\n\nBrak obciążenia partii.";
  }

  var assignedTotal = 0;
  keys.forEach(function(k){ assignedTotal += v[k]; });

  keys.sort(function(a,b){
    if(v[b] !== v[a]) return v[b] - v[a];
    return a.localeCompare(b);
  });

  var out = "";
  out += "Realnie wykonane: " + realTotal + " serii roboczych\n";
  out += "Suma przypisań do partii: " + assignedTotal + "\n";
  out += "Jedna seria może liczyć się do kilku partii, np. przysiad = czwórki + pośladek.\n\n";
  out += "Udział obciążenia partii:\n";

  keys.forEach(function(k){
    var pct = assignedTotal > 0 ? (v[k] / assignedTotal * 100) : 0;
    var pctText = pct.toFixed(1).replace(".0","").replace(".",",");
    out += k + ": " + v[k] + " serii przypisanych — " + pctText + "%\n";
  });

  return out.trim();
};

      lower.indexOf("wolniej") === 0 ||

      lower.indexOf("łokcia") >= 0 ||
      lower.indexOf("palucha") >= 0 ||
      lower.indexOf("kontrola") >= 0;

    var looksLikeSet =
      lower.indexOf(" x ") >= 0 ||
      lower.indexOf("kg") >= 0 ||
      lower.indexOf("masa ciała") >= 0 ||
      lower.indexOf("aktywacja") >= 0 ||
      lower.indexOf("pomiń") >= 0;

    if(looksLikeSet && !isNote){
      step++;
      html += "<div style='display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:9px 10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04);'>" +
        "<div style='min-width:28px;height:28px;border-radius:999px;background:rgba(255,0,70,.22);display:flex;align-items:center;justify-content:center;font-weight:800;'>" + step + "</div>" +
        "<div style='flex:1;font-size:15px;line-height:1.35;'>" + esc(line) + "</div></div>";
    }else{
      html += "<div class='small' style='margin:8px 0;padding:8px 10px;border-left:3px solid rgba(255,255,255,.22);background:rgba(255,255,255,.03);border-radius:8px;'>" + esc(line) + "</div>";
    }
  });

  return html;
};

window.exerciseLiveSummaryHtml = function(e){
  if(!e || !e.sets || !e.sets.length) return "<div class='small'>Brak serii roboczych w tym ćwiczeniu.</div>";

  var working = e.sets.filter(function(s){ return isWorkingSet(s); });
  if(!working.length) return "<div class='small'>Serie robocze: 0</div>";

  var heaviest = null;
  var best = null;
  var bestScore = -999999;

  working.forEach(function(s){
    var w = parseFloat(normalizeNumberText(s.w || s.weight || ""));
    var r = parseFloat(normalizeNumberText(s.r || s.reps || ""));

    if(!isNaN(w)){
      if(!heaviest || w > heaviest.w) heaviest = {w:w,line:getSetLine(s)};
    }

    var score = 0;
    if(!isNaN(w) && !isNaN(r)){
      score = w > 0 ? w * (1 + r / 30) : r;
    }else if(!isNaN(w)){
      score = w;
    }else if(!isNaN(r)){
      score = r;
    }

    if(score > bestScore){
      bestScore = score;
      best = getSetLine(s);
    }
  });

  return "<div style='display:grid;grid-template-columns:1fr;gap:8px;'>" +
    "<div>Serie robocze: <b>" + working.length + "</b></div>" +
    "<div>Najcięższa: <b>" + esc(heaviest ? heaviest.line : "brak") + "</b></div>" +
    "<div>Najlepsza seria: <b>" + esc(best || "brak") + "</b></div></div>";
};

var exerciseTimer = null;
window.startExerciseTimer = function(sec){
  if(sec === 0){
    var v = document.getElementById("exerciseTimerCustom");
    sec = parseInt(v && v.value ? v.value : "0", 10);
  }
  if(!sec || sec <= 0) return;

  if(exerciseTimer){clearInterval(exerciseTimer); exerciseTimer = null;}

  var end = Date.now() + sec * 1000;
  var el = document.getElementById("exerciseTimer");
  if(el){
    el.innerText = fmt(sec);
    el.className = "timer running";
  }

  exerciseTimer = setInterval(function(){
    var left = Math.ceil((end - Date.now()) / 1000);
    var node = document.getElementById("exerciseTimer");
    if(!node) return;
    if(left <= 0){
      clearInterval(exerciseTimer);
      exerciseTimer = null;
      node.innerText = "GOTOWE";
      node.className = "timer ready";
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
    }else{
      node.innerText = fmt(left);
      node.className = "timer running";
    }
  },300);
};

window.stopExerciseTimer = function(){
  if(exerciseTimer){clearInterval(exerciseTimer); exerciseTimer = null;}
  var el = document.getElementById("exerciseTimer");
  if(el){
    el.innerText = "00:00";
    el.className = "timer";
  }
};

  exercise();

makeReport = function(log){
  var out = "";
  out += "GYMLOG_CRUSH_V2.8\n";
  out += "Data: " + log.date + "\n";
  out += "Trening: " + log.training + "\n";
  out += "Tryb testowy: " + (log.testMode ? "TAK" : "NIE") + "\n";
  out += "Sen: " + log.sleep + "\n";
  out += "Waga: " + log.weight + "\n";
  out += "Samopoczucie: " + log.mood + "\n";
  out += "Trzeszczka/paluch przy chodzeniu 0-10: " + log.footWalk + "\n";
  out += "Trzeszczka/paluch przy wybiciu 0-10: " + log.footPush + "\n";
  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var oldLast = e.reportLast || e.last || "brak";
    out += "\n" + (i+1) + ". " + e.name + "\n";
    out += "Ostatnio: " + oldLast + "\n";
    out += "Plan na dziś: " + e.plan.replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";
    out += "Zrobione:\n";
    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";
    else e.sets.forEach(function(s){out += "- " + getSetLine(s) + "\n";});
  });

  out += "\nPodsumowanie obciążenia partii:\n";
  out += volumeSummaryText(log) + "\n";
  out += "\nEND_GYMLOG_CRUSH";
  return out;
};

window.finishWorkout = function(){
  if(!current) return;

  current.exercises.forEach(function(e){
    e.reportLast = data.lastByExercise[e.name] || e.last || "brak";
  });

  current.finishedAt = new Date().toISOString();

  var txt = makeReport(current);
  var summary = volumeSummaryText(current);

  if(!current.testMode){
    data.logs.unshift(current);
    data.draft = null;
    recomputeLastByExercise();
  }else{
    data.draft = null;
    safeSave();
  }

  copyText(txt);
  current = null;

  render(
    "<h1>GymLog CRUSH</h1><div class='badge'>Raport gotowy</div>" +
    "<div class='card'><h2>Podsumowanie treningu</h2><div class='box'>" + esc(summary) + "</div></div>" +

isBodyweightExercise = function(ex){
  if(ex && ex.bodyweight) return true;
  var n = String(ex && ex.name ? ex.name : "").toLowerCase();
  return n.indexOf("podciągan") >= 0 ||
    n.indexOf("pull-up") >= 0 ||
    n.indexOf("pull up") >= 0 ||
    n.indexOf("chin-up") >= 0 ||
    n.indexOf("chin up") >= 0 ||
    n.indexOf("dipy") >= 0 ||
    n.indexOf("pompki") >= 0 ||
    n.indexOf("dead bug") >= 0 ||
    n.indexOf("reverse crunch") >= 0 ||
    n.indexOf("heel taps") >= 0 ||
    n.indexOf("side plank") >= 0 ||
    n.indexOf("hollow") >= 0;
};

window.isSubstituteExercise = function(ex){
  return !!(ex && (ex.isSubstitute || ex.excludeProgression));
};

window.substituteOriginalName = function(ex){
  if(ex && ex.substituteOriginal && ex.substituteOriginal.name) return ex.substituteOriginal.name;
  if(ex && ex.substituteFor) return ex.substituteFor;
  return "";
};

window.parseSubGroups = function(txt, fallback){
  var arr = String(txt || "")
    .split(/[;,]/)
    .map(function(x){return x.trim();})
    .filter(function(x){return x.length > 0;});
  if(arr.length) return arr;
  return fallback && fallback.length ? fallback : ["Inne"];
};

window.applyExerciseSubstitution = function(){
  if(!current || !current.exercises || !current.exercises[idx]){ home(); return; }

  var e = current.exercises[idx];
  var newName = document.getElementById("subName").value.trim();
  var groupsText = document.getElementById("subGroups").value.trim();
  var type = document.getElementById("subType").value;
  var clearSets = document.getElementById("subClearSets").value === "TAK";

  if(!newName){ alert("Wpisz nazwę zamiennika."); return; }

  if(!e.substituteOriginal){
    e.substituteOriginal = {
      name:e.name,
      groups:e.groups || [],
      plan:e.plan || "",
      last:e.last || "",
      rest:e.rest || 120,
      bodyweight:!!e.bodyweight,
      autoRestRecord:!!e.autoRestRecord,
      timed:!!e.timed,
      exerciseTimer:!!e.exerciseTimer
    };
  }

  var original = e.substituteOriginal;

  e.name = newName;
  e.groups = window.parseSubGroups(groupsText, original.groups);
  e.plan = "ZAMIANA ĆWICZENIA\nZamienione za: " + original.name + "\nWpisuj serie według uznania.\nTa zamiana NIE będzie używana do progresji planu.\nPrzerwa bazowa: 02:00";
  e.last = "Zamiana ćwiczenia — brak podpowiedzi i brak progresji.";
  e.rest = 120;
  e.autoRestRecord = false;
  e.bodyweight = type === "bodyweight";
  e.timed = false;
  e.exerciseTimer = false;
  e.isSubstitute = true;
  e.excludeProgression = true;
  e.substituteFor = original.name;
  e.reportLast = "Zamiana ćwiczenia — nie liczona do progresji.";

  if(clearSets) e.sets = [];

  current.index = idx;
  data.draft = current;
  safeSave();
  exercise();
};

window.undoExerciseSubstitution = function(){
  if(!current || !current.exercises || !current.exercises[idx]){ home(); return; }

  var e = current.exercises[idx];
  if(!e.substituteOriginal){ exercise(); return; }

  if(e.sets && e.sets.length){
    var ok = confirm("Cofnąć zamianę i wyczyścić wpisane serie z zamiennika?");
    if(!ok) return;
  }

  var o = e.substituteOriginal;
  e.name = o.name;
  e.groups = o.groups || [];
  e.plan = o.plan || "";
  e.last = o.last || "";
  e.rest = o.rest || 120;
  e.bodyweight = !!o.bodyweight;
  e.autoRestRecord = !!o.autoRestRecord;
  e.timed = !!o.timed;
  e.exerciseTimer = !!o.exerciseTimer;
  e.sets = [];

  delete e.isSubstitute;
  delete e.excludeProgression;
  delete e.substituteFor;
  delete e.substituteOriginal;
  delete e.reportLast;

  current.index = idx;
  data.draft = current;
  safeSave();
  exercise();
};

recomputeLastByExercise = function(){
  var rebuilt = {};
  var rebuiltSets = {};

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise(e)) return;
      if(e.sets && e.sets.length){
        var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
        if(lines.length){
          rebuilt[e.name] = log.date + ": " + lines.join("; ");
          rebuiltSets[e.name] = e.sets.map(function(s){
            if(typeof s === "string") return parseSetLine(s, e);
            if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
            if(s.s) s.s = statusMapNew(s.s);
            return s;
          });
        }
      }
    });
  }

  data.lastByExercise = rebuilt;
  data.lastSetsByExercise = rebuiltSets;
  safeSave();
};

makeReport = function(log){
  var out = "";
  out += "GYMLOG_CRUSH_V3.0\n";
  out += "Data: " + log.date + "\n";
  out += "Trening: " + log.training + "\n";
  out += "Tryb testowy: " + (log.testMode ? "TAK" : "NIE") + "\n";
  out += "Sen: " + log.sleep + "\n";
  out += "Waga: " + log.weight + "\n";
  out += "Samopoczucie: " + log.mood + "\n";
  out += "Trzeszczka/paluch przy chodzeniu 0-10: " + log.footWalk + "\n";
  out += "Trzeszczka/paluch przy wybiciu 0-10: " + log.footPush + "\n";
  out += "Rehabilitacja stopy: " + log.rehab + "\n";
  out += "Uwagi: " + (log.notes || "brak") + "\n\n";
  out += "Ćwiczenia + ciężary + powtórzenia:\n";

  log.exercises.forEach(function(e,i){
    var sub = window.isSubstituteExercise(e);
    out += "\n" + (i+1) + ". " + e.name + "\n";
    if(sub){
      out += "Zamiana za: " + (e.substituteFor || window.substituteOriginalName(e) || "brak") + "\n";
      out += "Do progresji: NIE — zamiana ćwiczenia\n";
      out += "Ostatnio: Zamiana ćwiczenia — brak podpowiedzi i brak progresji.\n";
    }else{
      var oldLast = e.reportLast || e.last || "brak";
      out += "Ostatnio: " + oldLast + "\n";
    }
    out += "Plan na dziś: " + String(e.plan || "").replace(/\n/g," / ") + "\n";
    out += "Przerwa: " + restDescriptionReport(e) + "\n";
    out += "Zrobione:\n";
    if(!e.sets || !e.sets.length) out += "- brak wpisu\n";
    else e.sets.forEach(function(s){ out += "- " + getSetLine(s) + "\n"; });
  });

  out += "\nPodsumowanie obciążenia partii:\n";
  out += volumeSummaryText(log) + "\n";
  out += "\nEND_GYMLOG_CRUSH";
  return out;
};

window.finishWorkout = function(){
  if(!current) return;

  current.exercises.forEach(function(e){
    if(window.isSubstituteExercise(e)) e.reportLast = "Zamiana ćwiczenia — nie liczona do progresji.";
    else e.reportLast = data.lastByExercise[e.name] || e.last || "brak";
  });

  current.finishedAt = new Date().toISOString();
  var txt = makeReport(current);
  var summary = volumeSummaryText(current);

  if(!current.testMode){
    data.logs.unshift(current);
    data.draft = null;
    recomputeLastByExercise();

    safeSave();

  copyText(txt);
  current = null;

  render(
    "<h1>GymLog CRUSH</h1><div class='badge'>Raport gotowy</div>" +
    "<div class='card'><h2>Podsumowanie treningu</h2><div class='box'>" + esc(summary) + "</div></div>" +

};

VERSION = "BETA 0.31";

var GYMS_V31 = ["CityFit", "Siłownia Oskara", "Zdrofit Pruszków", "Wyjazd"];

function safeGymV31(g){
  g = String(g || "").trim();
  return GYMS_V31.indexOf(g) >= 0 ? g : "CityFit";
}

function defaultGymForTrainingV31(training){
  training = String(training || "");
  if(training === "Nogi") return "Siłownia Oskara";
  return "CityFit";
}

function getDefaultGymV31(training){
  if(data.gymDefaults && data.gymDefaults[training]) return safeGymV31(data.gymDefaults[training]);
  return defaultGymForTrainingV31(training);
}

function getLogGymV31(log){
  if(log && log.gym) return safeGymV31(log.gym);
  return defaultGymForTrainingV31(log && log.training ? log.training : "");
}

function shouldWriteProgressV31(gym){
  return safeGymV31(gym) !== "Wyjazd";
}

function ensureGymDataV31(){
  if(!data.gymDefaults) data.gymDefaults = {};
  if(!data.lastByExerciseByGym) data.lastByExerciseByGym = {};
  if(!data.lastSetsByExerciseByGym) data.lastSetsByExerciseByGym = {};
  if(!data.planOverridesByGym) data.planOverridesByGym = {};

getSuggestion = function(ex){
  if(window.isSubstituteExercise && window.isSubstituteExercise(ex)) return {w:"",r:"",s:"",n:""};
  var setNo = ex.sets ? ex.sets.length : 0;
  var gym = current ? safeGymV31(current.gym || getDefaultGymV31(current.training)) : "CityFit";
  var arr = getLastSetsForGymExerciseV31(gym, ex.name);
  if(arr && arr[setNo]){
    var s = typeof arr[setNo] === "string" ? parseSetLine(arr[setNo], ex) : arr[setNo];
    if(s && s.s) s.s = statusMapNew(s.s);
    return s;
  }
  var last = getLastTextForGymExerciseV31(gym, ex.name);
  if(last){
    var parsed = parseLastTextToSets(last, ex);
    if(parsed && parsed[setNo]) return parsed[setNo];
  }
  return {w:"",r:"",s:"",n:""};
};

recomputeLastByExercise = function(){
  ensureGymDataV31();

  var globalLast = {};
  var globalSets = {};
  var byGymLast = {};
  var byGymSets = {};

  GYMS_V31.forEach(function(g){
    byGymLast[g] = {};
    byGymSets[g] = {};
  });

  for(var i = 0; i < data.logs.length; i++){
    var log = data.logs[i];
    if(!log || !log.exercises) continue;

    var gym = getLogGymV31(log);
    var writeProgress = shouldWriteProgressV31(gym);

    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise && window.isSubstituteExercise(e)) return;
      if(!e.sets || !e.sets.length) return;

      var lines = e.sets.map(function(s){return getSetLine(s);}).filter(function(x){return x;});
      if(!lines.length) return;

      var normalizedSets = e.sets.map(function(s){
        if(typeof s === "string") return parseSetLine(s, e);
        if(!s.line) s.line = makeSetLine(e,s.w,s.r,s.s,s.n);
        if(s.s) s.s = statusMapNew(s.s);
        return s;
      });

      var text = log.date + ": " + lines.join("; ");

      if(writeProgress){
        if(!globalLast[e.name]){
          globalLast[e.name] = text;
          globalSets[e.name] = normalizedSets;
        }
        if(!byGymLast[gym]) byGymLast[gym] = {};
        if(!byGymSets[gym]) byGymSets[gym] = {};
        if(!byGymLast[gym][e.name]){
          byGymLast[gym][e.name] = text;
          byGymSets[gym][e.name] = normalizedSets;
        }
      }
    });
  }

  data.lastByExercise = globalLast;
  data.lastSetsByExercise = globalSets;
  data.lastByExerciseByGym = byGymLast;
  data.lastSetsByExerciseByGym = byGymSets;
  safeSave();
};

recomputeLastByExercise = function(){

  GYMS_V31.forEach(function(g){byGymLast[g]={};byGymSets[g]={};});

    function ts(x){var v=(x&&(x.finishedAt||x.createdAt||x.date))||"";var t=Date.parse(v);return isNaN(t)?0:t;}
    return ts(b)-ts(a);
  });
  logs.forEach(function(log){
    if(!log||!log.exercises)return;
    var gym=getLogGymV31(log); if(!shouldWriteProgressV31(gym))return;
    log.exercises.forEach(function(e){
      if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;

        return o;
      });
      var text=log.date+": "+lines.join("; ");
      if(!globalLast[e.name]){globalLast[e.name]=text;globalSets[e.name]=normalized;}
      if(!byGymLast[gym][e.name]){byGymLast[gym][e.name]=text;byGymSets[gym][e.name]=normalized;}
    });
  });
  data.lastByExercise=globalLast;data.lastSetsByExercise=globalSets;
  data.lastByExerciseByGym=byGymLast;data.lastSetsByExerciseByGym=byGymSets;
  safeSave();

function ghFmtDateV403(v){

      year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit"
    });

function ghHeadersV403(token,withJson){

    "X-GitHub-Api-Version":"2026-03-10"
  };

async function ghErrorMessageV403(res){

  }catch(e){}
  return "HTTP "+res.status;
}

function ghUtf8ToB64V403(str){
  var bytes=new TextEncoder().encode(str);
  var bin="",step=0x8000;
  for(var i=0;i<bytes.length;i+=step){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
  }
  return btoa(bin);
}

function ghB64ToUtf8V403(b64){
  var clean=String(b64||"").replace(/\s/g,"");
  var bin=atob(clean);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghCloudPayloadV403(){
  var cloned;
  try{cloned=JSON.parse(JSON.stringify(data));}catch(e){cloned=data;}
  if(cloned&&cloned.appUpdates)cloned.appUpdates=[];
  return {
    schema:"GYMLOG_CRUSH_CLOUD_BACKUP_V1",
    updatedAt:new Date().toISOString(),
    appVersion:VERSION,
    owner:GH_OWNER_V403,
    repository:GH_REPO_V403,
    data:cloned
  };
}

async function ghGetRemoteFileV403(){

  var url="https://api.github.com/repos/"+encodeURIComponent(GH_OWNER_V403)+"/"+
    encodeURIComponent(GH_REPO_V403)+"/contents/"+encodeURIComponent(GH_FILE_V403);

  var res=await fetch(url,{headers:ghHeadersV403(token,false),cache:"no-store"});

  if(res.status===404)return null;
  if(!res.ok)throw new Error(await ghErrorMessageV403(res));

  var file=await res.json();
  var parsed=null;
  try{
    parsed=JSON.parse(ghB64ToUtf8V403(file.content));
  }catch(e){
    throw new Error("Plik GitHub istnieje, ale nie jest prawidłowym backupem GymLog.");
  }

  return {sha:file.sha,payload:parsed};
}

async function ghPushV403(opts){
  opts=opts||{};
  var token=ghTokenV403();
  if(!token){
    if(!opts.silent)alert("Najpierw zapisz token GitHub w Backup.");
    return false;
  }

  if(!navigator.onLine){
    ghSetStatusV403({pending:true,lastError:"Brak internetu — synchronizacja czeka."});
    if(!opts.silent)alert("Brak internetu. Dane zostały zapisane lokalnie i synchronizacja poczeka.");
    return false;
  }

  var localCount=(data.logs||[]).length;

  if(localCount===0 && !opts.force){
    ghSetStatusV403({pending:true,lastError:"Lokalnie jest 0 treningów. Synchronizacja zablokowana ochronnie."});
    if(!opts.silent)alert("Lokalnie jest 0 treningów. Najpierw przywróć historię albo wykonaj trening — nie nadpisuję chmury pustą pamięcią.");
    return false;
  }

  ghSetStatusV403({pending:true,lastError:""});

  try{
    var remote=await ghGetRemoteFileV403();
    var remoteCount=0;

    if(remote&&remote.payload){
      var rd=remote.payload.data||remote.payload;
      remoteCount=(rd&&Array.isArray(rd.logs))?rd.logs.length:0;

      if(remoteCount>localCount && !opts.force){
        ghSetStatusV403({
          pending:true,
          lastError:"GitHub ma więcej treningów ("+remoteCount+") niż urządzenie ("+localCount+"). Najpierw pobierz dane z GitHub.",
          lastRemoteCount:remoteCount,
          lastLocalCount:localCount
        });
        if(!opts.silent){
          alert("Ochrona danych: GitHub ma "+remoteCount+" treningów, a urządzenie "+localCount+".\n\nNajpierw użyj „Pobierz dane z GitHub”, żeby nie nadpisać pełniejszej historii.");
        }
        return false;
      }
    }

    var payload=ghCloudPayloadV403();
    var body={
      message:"GymLog CRUSH backup — "+new Date().toISOString(),
      content:ghUtf8ToB64V403(JSON.stringify(payload,null,2))
    };
    if(remote&&remote.sha)body.sha=remote.sha;

    var url="https://api.github.com/repos/"+encodeURIComponent(GH_OWNER_V403)+"/"+
      encodeURIComponent(GH_REPO_V403)+"/contents/"+encodeURIComponent(GH_FILE_V403);

    var res=await fetch(url,{
      method:"PUT",
      headers:ghHeadersV403(token,true),
      body:JSON.stringify(body)
    });

    if(!res.ok)throw new Error(await ghErrorMessageV403(res));

    ghSetStatusV403({
      pending:false,
      lastSync:payload.updatedAt,
      lastError:"",
      lastRemoteCount:localCount,
      lastLocalCount:localCount
    });

    if(!opts.silent)alert("Backup GitHub zapisany.\n"+localCount+" treningów w "+GH_FILE_V403+".");
    return true;

  }catch(e){
    ghSetStatusV403({pending:true,lastError:String(e.message||e),lastLocalCount:localCount});
    if(!opts.silent)alert("Nie udało się zsynchronizować z GitHub:\n"+String(e.message||e));
    return false;
  }
}

function luxNum(v){var n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:null;}
function luxFmt(n,d){if(n==null||!isFinite(n))return "—";return n.toFixed(d==null?1:d).replace(".",",");}
function luxAvg(field){var a=[];(data.logs||[]).forEach(function(l){var n=luxNum(l&&l[field]);if(n!=null)a.push(n);});if(!a.length)return null;return a.reduce(function(x,y){return x+y;},0)/a.length;}

function luxSetObjForScore(s,e){
  if(!s)return null;
  if(typeof s==="string")return parseSetLine(s,e);
  if((s.w==null&&s.r==null)&&s.line)return parseSetLine(s.line,e);
  return s;
}
function luxExerciseStrengthScore(ex,log){
  if(!ex||!ex.sets)return null;
  var best=null;
  (ex.sets||[]).forEach(function(raw){
    var s=luxSetObjForScore(raw,ex);
    if(!s||!isWorkingSet(s))return;
    var w=luxNum(s.w!=null?s.w:s.weight);
    var r=luxNum(s.r!=null?s.r:s.reps);
    if(r==null||r<=0)return;

    var score=null;
    if(isBodyweightExercise(ex)){
      var bw=luxNum(log&&log.weight);
      if(bw!=null){
        var effective=bw+(w==null?0:w);
        if(effective>0)score=effective*(1+r/30);
      }
      if(score==null)score=r;
    }else{
      if(w!=null&&w>0)score=w*(1+r/30);
      else if(w!=null)score=w;
      else score=r;
    }
    if(score!=null&&(best==null||score>best))best=score;
  });
  return best;
}
function luxStrengthComparisonForTraining(training){
  var logs=(data.logs||[]).filter(function(l){return l&&l.training===training;});
  if(logs.length<2)return null;

  var latest=logs[0],gym=typeof getLogGymV31==="function"?getLogGymV31(latest):(latest.gym||"");
  var previous=null;
  for(var i=1;i<logs.length;i++){
    var g=typeof getLogGymV31==="function"?getLogGymV31(logs[i]):(logs[i].gym||"");
    if(g===gym){previous=logs[i];break;}
  }
  if(!previous)previous=logs[1];
  if(!previous)return null;

  var prevBy={};
  (previous.exercises||[]).forEach(function(e){
    if(e&&e.name)prevBy[e.name]=e;
  });

  var changes=[];
  (latest.exercises||[]).forEach(function(e){
    if(!e||!e.name)return;
    if(window.isSubstituteExercise&&window.isSubstituteExercise(e))return;
    var pe=prevBy[e.name];
    if(!pe)return;
    var a=luxExerciseStrengthScore(e,latest);
    var b=luxExerciseStrengthScore(pe,previous);
    if(a==null||b==null||b<=0)return;
    var pct=((a/b)-1)*100;
    if(isFinite(pct))changes.push({name:e.name,pct:pct});
  });

  if(!changes.length)return null;

  var avg=changes.reduce(function(sum,x){return sum+x.pct;},0)/changes.length;
  var up=0,down=0,flat=0;
  changes.forEach(function(x){
    if(x.pct>1)up++;
    else if(x.pct<-1)down++;
    else flat++;
  });

  return {
    training:training,
    gym:gym,
    latest:latest,
    previous:previous,
    pct:avg,
    up:up,
    down:down,
    flat:flat,
    count:changes.length
  };
}
function luxStrengthComparisons(){
  var seen={},out=[];
  (data.logs||[]).forEach(function(l){
    if(!l||!l.training||seen[l.training])return;
    seen[l.training]=true;
    var c=luxStrengthComparisonForTraining(l.training);
    if(c)out.push(c);
  });
  return out.slice(0,6);
}

  if(pct>0.5)return "pos";

/* History */
window.historyView=function(filter,page){
  stopTimer();luxStopWorkoutClock();
  filter=filter||window._historyCurrentFilter||"Wszystkie";
  if(page===undefined||page===null)page=(filter===window._historyCurrentFilter)?(window._pwaHistoryPage||0):0;
  window._historyCurrentFilter=filter;
  var all=["Wszystkie"];getPlanOrder().forEach(function(name){if(all.indexOf(name)<0)all.push(name);});(data.logs||[]).forEach(function(l){if(l.training&&all.indexOf(l.training)<0)all.push(l.training);});
  var opts="";all.forEach(function(name){opts+="<option value='"+esc(name)+"'"+selected(filter,name)+">"+esc(name)+"</option>";});
  var matches=[];(data.logs||[]).forEach(function(l,i){if(filter==="Wszystkie"||l.training===filter)matches.push({log:l,index:i});});
  var per=4,totalPages=Math.max(1,Math.ceil(matches.length/per));page=Math.max(0,Math.min(page,totalPages-1));window._pwaHistoryPage=page;var visible=matches.slice(page*per,page*per+per);
  var avgW=luxAvg("weight"),avgS=luxAvg("sleep");
  var html="<div class='lux-history-head'><h1>Historia</h1><select class='lux-filter' id='historyFilter' onchange='historyView(this.value,0)'>"+opts+"</select></div>"+
    "<div class='lux-summary-grid'><div class='lux-summary-tile'><div class='lux-summary-label'>Treningi</div><div class='lux-summary-value'>"+(data.logs||[]).length+"</div><div class='lux-summary-sub'>Wszystkie</div></div>"+
    "<div class='lux-summary-tile'><div class='lux-summary-label'>Śr. waga</div><div class='lux-summary-value'>"+luxFmt(avgW,1)+" kg</div><div class='lux-summary-sub'>z zapisanych</div></div>"+
    "<div class='lux-summary-tile'><div class='lux-summary-label'>Śr. sen</div><div class='lux-summary-value'>"+luxFmt(avgS,1)+" h</div><div class='lux-summary-sub'>z zapisanych</div></div></div>"+
    "<div class='lux-kicker' style='margin:4px 1px 10px'>OSTATNIE TRENINGI</div><div class='lux-history-list'>";
  visible.forEach(function(item){
    var l=item.log,i=item.index,gym=getLogGymV31(l),real=0;try{real=realWorkingSetsCount(l)||0;}catch(e){}
    html+="<article class='lux-history-card'><div class='lux-history-main'><div class='lux-history-icon'>II</div><div><div class='lux-history-name'>"+esc(l.training)+"</div><div class='lux-history-meta'>"+esc(gym)+" • "+esc(l.date)+"</div></div></div>"+
      "<div class='lux-history-stats'><span>⚖ "+esc(l.weight||"—")+" kg</span><span>☾ "+esc(l.sleep||"—")+" h</span><span>Serie: "+real+"</span><span>Paluch: "+esc(l.footWalk||"—")+" / "+esc(l.footPush||"—")+"</span></div>"+
      "<div class='lux-history-actions'><button onclick='historyDetailsView("+i+",\""+esc(filter)+"\")'>Szczegóły</button><button class='secondary' onclick='editHistory("+i+")'>Edytuj</button><button class='danger' onclick='deleteHistory("+i+")'>Usuń</button></div></article>";
  });
  if(!matches.length)html+="<div class='card small'>Brak treningów dla tego filtra.</div>";
  html+="</div>";
  if(matches.length>per){html+="<div class='historyPager'>"+(page>0?"<button class='secondary' onclick='historyView(\""+esc(filter)+"\","+(page-1)+")'>← Poprzednia</button>":"<span></span>")+"<div class='pageNo'>"+(page+1)+" / "+totalPages+"</div>"+(page<totalPages-1?"<button onclick='historyView(\""+esc(filter)+"\","+(page+1)+")'>Następna →</button>":"<span></span>")+"</div>";}
  html+=luxBottomNav("history");render(html);
};

/* Lightweight stats view */
window.luxStatsView=function(){
  stopTimer();luxStopWorkoutClock();

  var weight=luxFieldPair("weight");
  var sleep=luxFieldPair("sleep");
  var mood=luxFieldPair("mood");
  var latest=(data.logs||[])[0]||null;
  var latestSets=0;
  try{if(latest)latestSets=realWorkingSetsCount(latest)||0;}catch(e){}

  var currentHtml="<div class='lux-stats-section'>AKTUALNE</div>"+
    "<div class='lux-current-grid'>";

  if(weight.cur){
    currentHtml+="<div class='lux-current-tile primary'><div class='lux-current-label'>Waga</div>"+
      "<div class='lux-current-value'>"+luxFmt(weight.cur.n,1)+" kg "+luxDeltaHtml(weight," kg")+"</div>"+
      "<div class='lux-current-date'>"+esc(weight.cur.log&&weight.cur.log.date||"")+"</div></div>";
  }else{
    currentHtml+="<div class='lux-current-tile primary'><div class='lux-current-label'>Waga</div><div class='lux-current-value'>—</div></div>";
  }

  if(sleep.cur){
    currentHtml+="<div class='lux-current-tile'><div class='lux-current-label'>Sen</div>"+
      "<div class='lux-current-value'>"+luxFmt(sleep.cur.n,1)+" h "+luxDeltaHtml(sleep," h")+"</div>"+
      "<div class='lux-current-date'>"+esc(sleep.cur.log&&sleep.cur.log.date||"")+"</div></div>";
  }else{
    currentHtml+="<div class='lux-current-tile'><div class='lux-current-label'>Sen</div><div class='lux-current-value'>—</div></div>";
  }

  if(mood.cur){
    currentHtml+="<div class='lux-current-tile'><div class='lux-current-label'>Samopoczucie</div>"+
      "<div class='lux-current-value'>"+luxFmt(mood.cur.n,0)+"/10 "+luxDeltaHtml(mood,"")+"</div>"+
      "<div class='lux-current-date'>"+esc(mood.cur.log&&mood.cur.log.date||"")+"</div></div>";
  }else{
    currentHtml+="<div class='lux-current-tile'><div class='lux-current-label'>Samopoczucie</div><div class='lux-current-value'>—</div></div>";
  }

  currentHtml+="<div class='lux-current-tile'><div class='lux-current-label'>Ostatni trening</div>"+
    "<div class='lux-current-value' style='font-size:17px'>"+(latest?esc(latest.training):"—")+"</div>"+
    "<div class='lux-current-date'>"+(latest?esc(latest.date)+" • "+latestSets+" serii roboczych":"brak danych")+"</div></div></div>";

  var comps=luxStrengthComparisons();
  var strengthHtml="<div class='lux-stats-section'>PROGRES SIŁOWY</div>"+
    "<div class='lux-stats-note'>Porównanie z poprzednim treningiem tego samego planu, preferencyjnie na tej samej siłowni. Wskaźnik bazuje na najlepszych seriach roboczych.</div>"+
    "<div class='lux-strength-list'>";

  if(!comps.length){
    strengthHtml+="<div class='card small'>Potrzebne są co najmniej dwa porównywalne treningi danego planu.</div>";
  }else{
    comps.forEach(function(c){
      var cls=luxStrengthClass(c.pct);
      strengthHtml+="<div class='lux-strength-card'><div class='lux-strength-head'>"+
        "<div><div class='lux-strength-name'>"+esc(c.training)+"</div>"+
        "<div class='lux-strength-meta'>"+esc(c.gym||"")+" • "+esc(c.latest.date||"")+" vs "+esc(c.previous.date||"")+"</div></div>"+
        "<div class='lux-strength-change "+cls+"'>"+luxSignedPct(c.pct)+"</div></div>"+
        "<div class='lux-strength-breakdown'>Ćwiczenia porównane: "+c.count+
        " • ↑ "+c.up+" • = "+c.flat+" • ↓ "+c.down+"</div></div>";
    });
  }
  strengthHtml+="</div>";

  var avgW=luxAvg("weight"),avgS=luxAvg("sleep"),avgM=luxAvg("mood"),sets=luxWorkingSetsTotal();
  var avgHtml="<div class='lux-stats-section'>ŚREDNIE / CAŁOŚĆ</div>"+
    "<div class='lux-metric-grid'>"+
      "<div class='lux-metric'><div class='k'>Treningi</div><div class='v'>"+(data.logs||[]).length+"</div><div class='s'>w historii</div></div>"+
      "<div class='lux-metric'><div class='k'>Serie robocze</div><div class='v'>"+sets+"</div><div class='s'>łącznie</div></div>"+
      "<div class='lux-metric'><div class='k'>Średnia waga</div><div class='v'>"+luxFmt(avgW,1)+"</div><div class='s'>kg</div></div>"+
      "<div class='lux-metric'><div class='k'>Średni sen</div><div class='v'>"+luxFmt(avgS,1)+"</div><div class='s'>godz.</div></div>"+
      "<div class='lux-metric'><div class='k'>Śr. samopoczucie</div><div class='v' style='color:var(--lux-green)'>"+luxFmt(avgM,1)+"</div><div class='s'>/ 10</div></div>"+
      "<div class='lux-metric'><div class='k'>Ostatni plan</div><div class='v' style='font-size:16px'>"+(latest?esc(latest.training):"—")+"</div><div class='s'>"+(latest?esc(latest.date):"brak danych")+"</div></div>"+
    "</div>";

  render("<h1>Statystyki</h1>"+currentHtml+strengthHtml+avgHtml+luxBottomNav("stats"));
};
