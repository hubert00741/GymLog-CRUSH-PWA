/* Latest weight is determined by DATE, not by insertion/edit time.
   Same date: body measurement wins over workout, then latest updated timestamp. */
function gl068LatestWeightRecord(st){
  st=st||data||{};
  var rows=[];
  (st.logs||[]).forEach(function(l){
    var w=String(l&&l.weight||"").trim();
    var d=glDateStorage(l&&l.date||"");
    if(!w||!d)return;
    rows.push({
      weight:w,date:d,priority:1,
      stamp:String(l.finishedAt||l.createdAt||""),
      source:"workout"
    });
  });
  (st.bodyMeasurements||[]).forEach(function(m){
    var w=String(m&&m.weight||"").trim();
    var d=glDateStorage(m&&m.date||"");
    if(!w||!d)return;
    rows.push({
      weight:w,date:d,priority:2,
      stamp:String(m.updatedAt||m.createdAt||""),
      source:"measurement"
    });
  });
  rows.sort(function(a,b){
    var dc=String(b.date).localeCompare(String(a.date));
    if(dc)return dc;
    var pc=(b.priority||0)-(a.priority||0);
    if(pc)return pc;
    return String(b.stamp||"").localeCompare(String(a.stamp||""));
  });
  return rows[0]||null;
}
function gl068SyncCurrentWeight(st){
  st=st||data;
  if(!st)return null;
  var latest=gl068LatestWeightRecord(st);
  if(latest){
    if(!st.lastMeta||typeof st.lastMeta!=="object")st.lastMeta={};
    st.lastMeta.weight=latest.weight;
  }
  return latest;
}

/* ======================================================================
   0.68.1 — DURABLE WORKOUT FINALIZATION
   Goal: a finished workout must survive even if the main full-state sync
   is interrupted, the app is closed immediately, or a later cloud refresh
   happens before the normal debounced save completes.

   Layers:
   1) synchronous local finish journal BEFORE the normal finish handler;
   2) per-workout Supabase checkpoint (small independent cloud record);
   3) immediate full-state Supabase push + verification;
   4) automatic recovery from local/cloud checkpoints on next login.
   ====================================================================== */

function gl069WorkoutId(log){
  if(!log)return "";
  if(log.workoutId)return String(log.workoutId);
  var base=String(log.createdAt||new Date().toISOString()).replace(/[^0-9]/g,"").slice(0,17);
  var rnd="";
  try{
    if(window.crypto&&crypto.getRandomValues){
      var a=new Uint32Array(2);crypto.getRandomValues(a);
      rnd=a[0].toString(36)+a[1].toString(36);
    }
  }catch(e){}
  if(!rnd)rnd=Math.random().toString(36).slice(2,12);
  log.workoutId="wo_"+base+"_"+rnd;
  return log.workoutId;
}
function gl069SameWorkout(a,b){
  if(!a||!b)return false;
  if(a.workoutId&&b.workoutId)return String(a.workoutId)===String(b.workoutId);
  return String(a.date||"")===String(b.date||"") &&
         String(a.training||"")===String(b.training||"") &&
         String(a.gym||"")===String(b.gym||"") &&
         String(a.createdAt||"")===String(b.createdAt||"");
}
function gl069HasWorkout(list,workout){
  return (list||[]).some(function(x){return gl069SameWorkout(x,workout);});
}
function gl069JournalKey(uid){
  return "GYMLOG_CRUSH_FINISH_JOURNAL_"+String(uid||"")+"_V1";
}
function gl069JournalRead(uid){
  try{
    var raw=localStorage.getItem(gl069JournalKey(uid));
    var arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){return [];}
}
function gl069JournalWrite(uid,arr){
  try{
    localStorage.setItem(gl069JournalKey(uid),JSON.stringify((arr||[]).slice(-12)));
    return true;
  }catch(e){return false;}
}
function gl069JournalAdd(uid,workout){
  var arr=gl069JournalRead(uid),id=gl069WorkoutId(workout);
  arr=arr.filter(function(x){return x&&x.workout&&String(x.workout.workoutId||"")!==id;});
  arr.push({savedAt:new Date().toISOString(),workout:workout});
  return gl069JournalWrite(uid,arr);
}
function gl069JournalRemove(uid,workoutId){
  var arr=gl069JournalRead(uid).filter(function(x){
    return !(x&&x.workout&&String(x.workout.workoutId||"")===String(workoutId||""));
  });
  gl069JournalWrite(uid,arr);
}

}

async function gl069CheckpointUpsert(workout){
  if(!navigator.onLine)return false;
  var s=await glEnsureSession();
  if(!s||!s.user||!s.user.id)return false;
  var wid=gl069WorkoutId(workout);

    await glApi("/rest/v1/workout_finish_checkpoints?on_conflict=user_id,workout_id",{
      method:"POST",

        "Content-Type":"application/json",

      },

async function gl069RemoteContainsWorkout(workout){
  if(!navigator.onLine)return false;
  var s=await glEnsureSession();
  if(!s||!s.user||!s.user.id)return false;
  try{
    var remote=await glFetchRemoteState(s.user.id);

    if(found&&remote.sync_revision!=null){

async function gl069FinalizeCompletedWorkout(workout){
  var s=glSession(),uid=s&&s.user&&s.user.id;
  if(!uid||!workout)return false;

  gl069FinishStatus(
    navigator.onLine
      ?"Zapisano lokalnie • zabezpieczam trening w Supabase…"
      :"Zapisano lokalnie • offline — synchronizacja dokończy się automatycznie.",
    "pending"
  );

  if(!navigator.onLine)return false;

  // Independent per-workout cloud checkpoint first.
  var checkpointOk=await gl069CheckpointUpsert(workout);

  // Then push the complete application state immediately (do not wait for debounce).
  var stateOk=await glPushCloudState();

  // Verify that the exact workout made it into the main cloud state.
  var verified=false;
  if(stateOk)verified=await gl069RemoteContainsWorkout(workout);

  // One retry if the full-state write returned but verification did not find the log.
  if(!verified){
    try{
      if(!gl069HasWorkout(data.logs,workout)){
        data.logs.unshift(workout);
        try{recomputeLastByExercise();}catch(e){}
        safeSave();
      }
      stateOk=await glPushCloudState();
      if(stateOk)verified=await gl069RemoteContainsWorkout(workout);
    }catch(e){}
  }

  if(verified){
    await gl069CheckpointDelete(workout.workoutId);
    gl069JournalRemove(uid,workout.workoutId);
    gl069FinishStatus("Trening bezpiecznie zapisany w Supabase.", "ok");
    return true;
  }

  // Keep both the local journal and (when it succeeded) cloud checkpoint.
  gl069FinishStatus(
    checkpointOk
      ?"Trening ma kopię awaryjną w chmurze. Pełna synchronizacja dokończy się automatycznie."
      :"Trening zapisany lokalnie. Synchronizacja dokończy się automatycznie po odzyskaniu połączenia.",
    "bad"
  );
  return false;
}

/* Final wrapper around ALL owner/managed finish modes.
   The journal is written synchronously before any existing finish code runs. */
var gl069BaseFinishWorkout=window.finishWorkout;
window.finishWorkout=function(){
  if(!current)return gl069BaseFinishWorkout.apply(this,arguments);

  var s=glSession(),uid=s&&s.user&&s.user.id;
  var nowIso=new Date().toISOString();

  gl069WorkoutId(current);
  if(!current.finishedAt)current.finishedAt=nowIso;
  if(current.createdAt){
    try{
      var seconds=Math.max(0,Math.round((new Date(current.finishedAt)-new Date(current.createdAt))/1000));
      if(isFinite(seconds))current.durationSeconds=seconds;
    }catch(e){}
  }

  var snap=null;
  try{snap=JSON.parse(JSON.stringify(current));}catch(e){snap=current;}

  if(uid&&snap)gl069JournalAdd(uid,snap);

  var result=gl069BaseFinishWorkout.apply(this,arguments);

  // Ensure the already-finalized log carries the stable ID/timing snapshot.
  try{
    if(snap&&!gl069HasWorkout(data.logs,snap)){
      data.logs.unshift(snap);
      data.draft=null;
      try{recomputeLastByExercise();}catch(e){}
      safeSave();
    }else if(snap){
      var saved=(data.logs||[]).find(function(x){return gl069SameWorkout(x,snap);});
      if(saved){
        saved.workoutId=snap.workoutId;
        if(!saved.finishedAt)saved.finishedAt=snap.finishedAt;
        if(saved.durationSeconds==null&&snap.durationSeconds!=null)saved.durationSeconds=snap.durationSeconds;
        safeSave();
      }
    }
  }catch(e){}

  setTimeout(function(){gl069FinalizeCompletedWorkout(snap);},0);
  return result;
};
finishWorkout=window.finishWorkout;

async function gl069RecoverPendingWorkouts(){
  var s=glSession();
  if(!GL_AUTH_READY||!s||!s.user||!s.user.id)return false;
  var uid=s.user.id,all=[],seen={};

  gl069JournalRead(uid).forEach(function(entry){
    var w=entry&&entry.workout;if(!w)return;

      var id=gl069WorkoutId(w);if(!seen[id]){seen[id]=1;all.push(w);}
    });
  }

  if(!all.length)return false;

  var changed=false;
  all.forEach(function(w){
    if(!gl069HasWorkout(data.logs,w)){
      data.logs.unshift(w);
      changed=true;
    }
  });

  if(changed){
    try{recomputeLastByExercise();}catch(e){}

  }

function gl086LoadImage(file){
  return new Promise(function(resolve,reject){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){URL.revokeObjectURL(url);resolve(img);};
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("Nie udało się odczytać zdjęcia."));};
    img.src=url;
  });
}
async function gl086AvatarBlob(file){
  if(!file||!String(file.type||"").startsWith("image/"))throw new Error("Wybierz plik ze zdjęciem.");
  if(file.size>12*1024*1024)throw new Error("Zdjęcie jest zbyt duże. Maksymalnie 12 MB przed kompresją.");
  var img=await gl086LoadImage(file);
  var side=Math.min(img.naturalWidth||img.width,img.naturalHeight||img.height);
  if(!side)throw new Error("Nie udało się odczytać wymiarów zdjęcia.");
  var sx=((img.naturalWidth||img.width)-side)/2,sy=((img.naturalHeight||img.height)-side)/2;
  var c=document.createElement("canvas");c.width=512;c.height=512;
  var ctx=c.getContext("2d");if(!ctx)throw new Error("Brak obsługi przetwarzania zdjęcia.");
  ctx.drawImage(img,sx,sy,side,side,0,0,512,512);
  return await new Promise(function(resolve,reject){
    c.toBlob(function(blob){blob?resolve(blob):reject(new Error("Nie udało się przygotować zdjęcia."));},"image/jpeg",0.88);
  });
}

/* ======================================================================
   0.68.8 — HUBERT TRAINING LABEL MIGRATION
   Naming only:
   Nogi -> LEGS
   Brzuch -> CORE
   Płaska rekord -> BENCH PR
   Day 1 PUSH / Day 2 PULL / Day 3 UPPER remain unchanged.
   ====================================================================== */
function gl088IsHubertFull(){
  var p=window.GL_PROFILE||glSavedProfile()||{};
  return String(p.username||"").toLowerCase()==="hubert" && String(p.role||"")==="admin";
}
function gl088MoveKey(obj,oldKey,newKey){
  if(!obj||typeof obj!=="object"||Array.isArray(obj))return false;
  if(!Object.prototype.hasOwnProperty.call(obj,oldKey))return false;
  if(!Object.prototype.hasOwnProperty.call(obj,newKey))obj[newKey]=obj[oldKey];
  delete obj[oldKey];
  return true;
}
function gl088TrainingName(v){
  if(v==="Nogi")return "LEGS";
  if(v==="Brzuch")return "CORE";
  if(v==="Płaska rekord")return "BENCH PR";
  return v;
}
function gl088RenameHubertState(d){
  if(!d||typeof d!=="object"||!gl088IsHubertFull())return d;

  gl088MoveKey(d.planOverrides,"Nogi","LEGS");
  gl088MoveKey(d.planOverrides,"Brzuch","CORE");
  gl088MoveKey(d.planOverrides,"Płaska rekord","BENCH PR");

  gl088MoveKey(d.gymDefaults,"Nogi","LEGS");
  gl088MoveKey(d.gymDefaults,"Brzuch","CORE");
  gl088MoveKey(d.gymDefaults,"Płaska rekord","BENCH PR");

  if(d.planOverridesByGym&&typeof d.planOverridesByGym==="object"){
    Object.keys(d.planOverridesByGym).forEach(function(gym){
      var o=d.planOverridesByGym[gym];
      gl088MoveKey(o,"Nogi","LEGS");
      gl088MoveKey(o,"Brzuch","CORE");
      gl088MoveKey(o,"Płaska rekord","BENCH PR");
    });
  }

  if(Array.isArray(d.logs)){
    d.logs.forEach(function(log){
      if(log&&typeof log==="object")log.training=gl088TrainingName(log.training);
    });
  }

  if(d.draft&&typeof d.draft==="object"){
    d.draft.training=gl088TrainingName(d.draft.training);
  }

  return d;
}
var gl088BaseNormalizeState=glNormalizeState;
glNormalizeState=function(d){
  return gl088RenameHubertState(gl088BaseNormalizeState(d));
};

/* ======================================================================

   ====================================================================== */
(function(){
  function gl099NormalizeMultiline(value){
    var s=String(value==null?"":value);
    /* Support:
       - real line feeds,
       - literal backslash+n from older managed-user data,
       - double escaped backslash+backslash+n. */
    s=s.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    s=s.replace(/\\\\n/g,"\n").replace(/\\n/g,"\n");
    s=s.replace(/\\\\r/g,"\n").replace(/\\r/g,"\n");
    return s;
  }

  function gl099CleanSetLine(line){
    line=String(line||"").trim();
    /* A few old exports stored "1. " inside the value itself.
       The UI already shows its own set number. */
    line=line.replace(/^\s*\d+\.\s+(?=\S)/,"");
    return line.trim();
  }

  function gl099SetLines(ex){
    var result=[];
    ((ex&&ex.sets)||[]).forEach(function(set){
      var raw="";
      try{raw=typeof set==="string"?set:getSetLine(set);}catch(e){raw=String(set||"");}
      gl099NormalizeMultiline(raw).split(/\n+/).forEach(function(part){
        var line=gl099CleanSetLine(part);
        if(line)result.push(line);
      });
    });
    return result;
  }

  function gl099HtmlMultiline(value){
    return esc(gl099NormalizeMultiline(value))
      .replace(/\n+/g,"<br>");
  }

/* ======================================================================
   0.70.2 — global clipboard fix
   Some legacy report buttons use inline onclick handlers. The original
   copyText() lived inside the app closure, so Safari could not resolve it
   from an inline handler. Expose one robust global clipboard function.
   ====================================================================== */
window.copyText=function(value){
  var text=String(value==null?"":value);

  function fallbackCopy(){
    var area=document.createElement("textarea");
    area.value=text;
    area.setAttribute("readonly","");
    area.style.position="fixed";
    area.style.left="-9999px";
    area.style.top="0";
    area.style.opacity="0";
    area.style.fontSize="16px";
    document.body.appendChild(area);
    area.focus();
    area.select();
    try{area.setSelectionRange(0,area.value.length);}catch(e){}

    var ok=false;
    try{ok=!!document.execCommand("copy");}catch(e){ok=false;}
    area.remove();

    if(!ok){
      try{window.prompt("Skopiuj raport ręcznie:",text);}catch(e){}
    }
    return ok;
  }

  try{
    if(window.isSecureContext && navigator.clipboard && typeof navigator.clipboard.writeText==="function"){
      return navigator.clipboard.writeText(text).catch(function(){
        fallbackCopy();
      });
    }
  }catch(e){}

  fallbackCopy();
  return Promise.resolve();
};

/* Route the standard copy actions through the same global implementation. */
window.copyFinalReport=function(){
  var el=document.getElementById("rep");
  if(!el)return;
  window.copyText(el.value);
  alert("Raport skopiowany.");
};
window.copyHistory=function(i){

};
window.copyBackup=function(){

};

/* ======================================================================
   0.70.3 — regional glute taxonomy
   Training-oriented regional split:
   - gluteus maximus upper / middle / lower
   - gluteus medius as a separate muscle
   ====================================================================== */
(function(){
  var GL073_UPPER="Pośladkowy wielki — część górna";
  var GL073_MID="Pośladkowy wielki — część środkowa";
  var GL073_LOWER="Pośladkowy wielki — część dolna";
  var GL073_MEDIUS="Pośladkowy średni";
  var GL073_ALL=[GL073_UPPER,GL073_MID,GL073_LOWER,GL073_MEDIUS];

  function gl073Norm(value){
    return String(value||"").toLowerCase()
      .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e").replace(/ł/g,"l")
      .replace(/ń/g,"n").replace(/ó/g,"o").replace(/ś/g,"s").replace(/ź|ż/g,"z")
      .replace(/[–—]/g,"-").replace(/\s+/g," ").trim();
  }

  function gl073RegionsForExercise(name){
    var n=gl073Norm(name);

    /* Hip abduction: gluteus medius is primary; upper glute max assists. */
    if(n.indexOf("odwodzenie")>=0 || n.indexOf("hip abduction")>=0){
      return [GL073_MEDIUS,GL073_UPPER];
    }

    /* Hip thrust / bridge: shortened-position hip extension,
       assigned to upper + middle glute max regions. */
    if(n.indexOf("hip thrust")>=0 || n.indexOf("glute bridge")>=0 || n.indexOf("most biodrow")>=0){
      return [GL073_UPPER,GL073_MID];
    }

    /* Cable/machine kickback: hip extension with strongest practical
       assignment to upper + middle glute max. */
    if(n.indexOf("kickback")>=0 || n.indexOf("kick back")>=0){
      return [GL073_UPPER,GL073_MID];
    }

    /* Long-length hip extension / deep hip flexion patterns. */
    if(n==="rdl" || n.indexOf("romanian deadlift")>=0 || n.indexOf("martwy ciag rumun")>=0 ||
       (n.indexOf("przysiad")>=0 && n.indexOf("maszyn")>=0) ||
       n.indexOf("suwnica")>=0 || n.indexOf("leg press")>=0 ||
       n.indexOf("lawka rzymska")>=0 || n.indexOf("roman bench")>=0 ||
       n.indexOf("back extension")>=0 || n.indexOf("hip extension")>=0 ||
       n.indexOf("bulgar")>=0 || n.indexOf("split squat")>=0 ||
       n.indexOf("wykrok")>=0 || n.indexOf("step up")>=0){
      return [GL073_MID,GL073_LOWER];
    }

    return [];
  }

  function gl073IsAnyGluteGroup(group){
    var g=gl073Norm(group);
    return g.indexOf("poslad")>=0 || GL073_ALL.indexOf(String(group||""))>=0;
  }

  function gl073CorrectGroups(name,groups){
    var original=Array.isArray(groups)?groups.slice():[];
    var nonGlute=original.filter(function(g){return !gl073IsAnyGluteGroup(g);});
    var regions=gl073RegionsForExercise(name);

    if(regions.length){
      return nonGlute.concat(regions);
    }

    /* If an unknown legacy exercise only says "Pośladek", keep the set
       visible in the new taxonomy without pretending it is gluteus medius. */
    var hadLegacy=original.some(function(g){
      var x=gl073Norm(g);
      return x==="posladek" || x==="posladki";
    });
    if(hadLegacy)return nonGlute.concat([GL073_MID]);

    /* Already-detailed/custom glute groups remain untouched. */
    var detailed=original.filter(function(g){return GL073_ALL.indexOf(g)>=0;});
    return nonGlute.concat(detailed);
  }

  window.gl073CorrectGroups=gl073CorrectGroups;
  window.gl073RegionsForExercise=gl073RegionsForExercise;

  /* Built-in admin plans, including any later in-memory version. */
  try{
    Object.keys(PLANS||{}).forEach(function(plan){
      (PLANS[plan]||[]).forEach(function(ex){
        ex.groups=gl073CorrectGroups(ex.name,ex.groups);
      });
    });
  }catch(e){}

  /* Managed plans loaded from cached profile or Supabase. */
  var gl073BaseManagedExercises=window.glManagedExercises||glManagedExercises;
  window.glManagedExercises=glManagedExercises=function(planName){
    var arr=glManagedPlans()[planName];
    if(!Array.isArray(arr))return [];
    return arr.map(function(x){
      var sets=Math.max(1,parseInt(x.sets||3,10)||3);
      var reps=String(x.reps||"8-12");
      var rest=Math.max(0,parseInt(x.rest||120,10)||120);
      return {
        name:String(x.name||"Ćwiczenie"),
        groups:gl073CorrectGroups(x.name,x.groups),
        bodyweight:x.bodyweight===true,
        last:"",
        plan:sets+" × "+reps+" powt.",
        rest:rest,
        managedSets:sets,
        managedReps:reps,
        managedStarter:String(x.starter||""),
        sets:[]
      };
    });
  };

  /* Plan editor: normalize legacy selections before drawing checkboxes. */
  gl065MusclePickerHtml=function(e,i){
    var selectedGroups=gl073CorrectGroups(e&&e.name,(e&&e.groups)||[]);
    return "<div class='gl-muscle-picker-065'>"+GL065_MUSCLE_GROUPS.map(function(g){
      var checked=selectedGroups.indexOf(g)>=0?" checked":"";
      return "<label class='gl-muscle-chip-065'><input type='checkbox' name='pe_groups_"+i+"' value='"+esc(g)+"'"+checked+"><span>"+esc(g)+"</span></label>";
    }).join("")+"</div>";
  };

  /* Dynamic normalization makes old history immediately use the new split
     without changing its recorded sets, loads, RIR/status or notes. */
  volumeSummary=function(log){
    var volume={};
    if(!log||!log.exercises)return volume;

    log.exercises.forEach(function(ex){
      var groups=gl073CorrectGroups(ex&&ex.name,(ex&&ex.groups)||[]);
      if(!groups.length)groups=["Inne"];

      var count=0;
      (ex.sets||[]).forEach(function(set){
        if(isWorkingSet(set))count++;
      });

      if(count>0){
        groups.forEach(function(group){
          if(!volume[group])volume[group]=0;
          volume[group]+=count;
        });
      }
    });
    return volume;
  };

  /* Cloud/local state normalization for active drafts and future loads.
     We do not force-save on boot; this avoids creating an unnecessary
     whole-state write merely for the visualization migration. */
  if(typeof glNormalizeState==="function"){
    var gl073BaseNormalizeState=glNormalizeState;
    glNormalizeState=function(d){
      d=gl073BaseNormalizeState(d);
      if(!d||typeof d!=="object")return d;
      function fixWorkout(w){
        if(!w||!Array.isArray(w.exercises))return;
        w.exercises.forEach(function(ex){
          if(ex)ex.groups=gl073CorrectGroups(ex.name,ex.groups);
        });
      }
      fixWorkout(d.draft);
      (d.logs||[]).forEach(fixWorkout);
      return d;
    };
  }
})();

})();

  var GL110_REMEMBER_BLOB="GYMLOG_CRUSH_REMEMBER_BLOB_V1";
  var GL110_REMEMBER_KEY="GYMLOG_CRUSH_REMEMBER_KEY_V1";
  var GL110_REMEMBER_ON="GYMLOG_CRUSH_REMEMBER_ON_V1";
  function gl110B64(bytes){var s="";bytes.forEach(function(b){s+=String.fromCharCode(b);});return btoa(s);}
  function gl110Unb64(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function gl110RememberCryptoKey(){
    if(!window.crypto||!crypto.subtle)return null;
    var raw=localStorage.getItem(GL110_REMEMBER_KEY);
    if(!raw){var a=new Uint8Array(32);crypto.getRandomValues(a);raw=gl110B64(a);localStorage.setItem(GL110_REMEMBER_KEY,raw);}
    return crypto.subtle.importKey("raw",gl110Unb64(raw),{name:"AES-GCM"},false,["encrypt","decrypt"]);
  }
  async function gl110RememberSave(username,password){
    try{
      var key=await gl110RememberCryptoKey();if(!key)throw new Error("Brak WebCrypto");
      var iv=new Uint8Array(12);crypto.getRandomValues(iv);
      var plain=new TextEncoder().encode(JSON.stringify({u:username,p:password}));
      var enc=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,plain));
      localStorage.setItem(GL110_REMEMBER_BLOB,JSON.stringify({iv:gl110B64(iv),data:gl110B64(enc)}));
      localStorage.setItem(GL110_REMEMBER_ON,"1");
    }catch(e){console.log("Remember save:",e);}
  }
  async function gl110RememberRead(){
    try{
      if(localStorage.getItem(GL110_REMEMBER_ON)!=="1")return null;
      var raw=localStorage.getItem(GL110_REMEMBER_BLOB);if(!raw)return null;
      var obj=JSON.parse(raw),key=await gl110RememberCryptoKey();if(!key)return null;
      var dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:gl110Unb64(obj.iv)},key,gl110Unb64(obj.data));
      return JSON.parse(new TextDecoder().decode(dec));
    }catch(e){console.log("Remember read:",e);return null;}
  }
  window.gl110RememberClear=function(){
    try{localStorage.removeItem(GL110_REMEMBER_BLOB);localStorage.removeItem(GL110_REMEMBER_ON);}catch(e){}
  };

/* ======================================================================

  async function gl112FetchProfiles(ids){

    var filter="("+unique.map(function(x){return encodeURIComponent(x);}).join(",")+")";
    try{
      var rows=await glApi(
        "/rest/v1/profiles?select=id,username,display_name&id=in."+filter,
        {method:"GET"},s
      );
      (rows||[]).forEach(function(p){map[p.id]=p;});
    }catch(e){console.log("Feedback profiles:",e);}
    return map;
  }
  async function gl112UnreadCount(){

/* ======================================================================
   0.71.3
   1. Owner/admin can edit his own native plan structure.
   2. New account types: client / admin / trainer / trainee.
   3. Report-code and goal-code toggles are rendered in a dedicated,
      reliable card in the selected user's settings.
   ====================================================================== */
(function(){
  var GL113_ROLES=["client","admin","trainer","trainee"];
  var GL113_BUILTIN_OWNER_PLANS={};
  try{GL113_BUILTIN_OWNER_PLANS=JSON.parse(JSON.stringify(PLANS||{}));}catch(e){GL113_BUILTIN_OWNER_PLANS={};}

  window.gl113RoleLabel=function(role){
    role=String(role||"").toLowerCase();
    if(role==="admin")return "Admin";
    if(role==="trainer")return "Trener";
    if(role==="trainee")return "Podopieczny";
    if(role==="client"||role==="user")return "Klient";
    return "Klient";
  };
  function gl113RoleValue(role){
    role=String(role||"").toLowerCase();
    if(role==="user")return "client";
    return GL113_ROLES.indexOf(role)>=0?role:"client";
  }
  function gl113RoleOptions(selectedRole,disableAdmin){
    var selected=gl113RoleValue(selectedRole);
    var rows=[
      ["client","Klient"],
      ["admin","Admin"],
      ["trainer","Trener"],
      ["trainee","Podopieczny"]
    ];
    return rows.map(function(x){
      return "<option value='"+x[0]+"'"+(selected===x[0]?" selected":"")+(disableAdmin&&x[0]!=="admin"?" disabled":"")+">"+x[1]+"</option>";
    }).join("");
  }
  function gl113ManagedFlagsForRole(role){
    role=gl113RoleValue(role);
    if(role==="admin"){
      return {
        managedMode:false,gymSelection:true,chatReport:true,goalUpdate:true,
        footTracking:true,muscleMap:true,bodyWeight:true,adminUsers:true,
        planEdit:true,mood:true
      };
    }
    var f={};
    try{f=Object.assign({},glDefaultManagedFlags());}catch(e){}
    return Object.assign(f,{
      managedMode:true,gymSelection:false,chatReport:false,goalUpdate:false,
      footTracking:false,muscleMap:true,bodyWeight:true,adminUsers:false,
      planEdit:false,mood:true
    });
  }
  async function gl113Session(){
    var s=await glEnsureSession();
    if(!s||!s.user)throw new Error("Brak aktywnej sesji.");
    return s;
  }
  async function gl113PatchProfile(userId,payload){
    var s=await gl113Session();
    return await glApi("/rest/v1/profiles?id=eq."+encodeURIComponent(userId),{
      method:"PATCH",
      headers:{"Content-Type":"application/json","Prefer":"return=representation"},
      body:JSON.stringify(payload||{})
    },s);
  }

  /* ----------------------------------------------------------
     ROLE LABELS IN ACCOUNT UI
     ---------------------------------------------------------- */
  gl086AccountRole=function(){
    var p={};
    try{p=gl085Profile()||{};}catch(e){p=window.GL_PROFILE||{};}
    return gl113RoleLabel(p.role);
  };
  window.gl086AccountRole=gl086AccountRole;

  /* ----------------------------------------------------------
     CREATE USER: role/category selector + reliable role save
     ---------------------------------------------------------- */
  function gl113EnhanceUsersCreate(){
    if(!glIsAdmin())return;
    var gender=document.getElementById("muNewGender");
    if(gender&&!document.getElementById("muNewRole")){
      var oldLabel=gender.previousElementSibling;
      if(oldLabel&&String(oldLabel.tagName||"").toLowerCase()==="label")oldLabel.textContent="Motyw / płeć";

      var box=document.createElement("div");
      box.className="gl113-account-role-box";
      box.innerHTML=
        "<label>Rodzaj konta</label>"+
        "<select id='muNewRole'>"+gl113RoleOptions("client",false)+"</select>"+
        "<div class='gl113-account-role-note'>Admin ma uprawnienia administracyjne. Klient, Trener i Podopieczny korzystają z trybu treningowego; te kategorie rozdzielają typ użytkowania konta i pozwalają dalej rozwijać uprawnienia.</div>";
      gender.parentNode.insertBefore(box,oldLabel||gender);
    }

    var cards=Array.prototype.slice.call(document.querySelectorAll(".mu-user-card"));
    (window.GL_ADMIN_USERS||[]).forEach(function(u,i){
      var card=cards[i];if(!card)return;
      var meta=card.querySelector(".mu-user-meta");
      if(meta)meta.textContent="@"+String(u.username||"")+" • "+gl113RoleLabel(u.role);
    });
  }

  var gl113BaseUsersView=window.glUsersView;
  window.glUsersView=async function(){
    var r=await gl113BaseUsersView.apply(this,arguments);
    requestAnimationFrame(gl113EnhanceUsersCreate);
    return r;
  };

  window.glAdminCreateUser=async function(){
    var username=String((document.getElementById("muNewLogin")||{}).value||"").trim().toLowerCase();
    var name=String((document.getElementById("muNewName")||{}).value||username).trim();
    var password=String((document.getElementById("muNewPass")||{}).value||"");
    var gender=String((document.getElementById("muNewGender")||{}).value||"male");
    var role=gl113RoleValue((document.getElementById("muNewRole")||{}).value||"client");

    if(password.length<6){alert("Hasło musi mieć minimum 6 znaków.");return;}
    if(!username){alert("Wpisz login.");return;}

    var flags=gl113ManagedFlagsForRole(role);
    var cfg={managedMode:role!=="admin",managed_plans:{},gender:gender,accountType:role};

    try{
      /* account-settings creates the Auth user; profile role is then changed
         through the existing admin RLS policy. */
      var created=await glAdminApi({
        action:"create_user",
        username:username,
        display_name:name,
        password:password,
        feature_flags:flags,
        profile_config:cfg
      });
      var uid=created&&created.user&&created.user.id;
      if(!uid)throw new Error("Konto utworzone, ale serwer nie zwrócił ID użytkownika.");
      await gl113PatchProfile(uid,{role:role,feature_flags:flags,profile_config:cfg});
      alert("Użytkownik utworzony jako: "+gl113RoleLabel(role)+".");
      glUsersView();
    }catch(e){
      alert("Nie udało się utworzyć użytkownika: "+String(e&&e.message||e));
    }
  };

  /* ----------------------------------------------------------
     SELECTED USER SETTINGS:
     - account role
     - dedicated report-code/goal-code card
     ---------------------------------------------------------- */

  /* ----------------------------------------------------------
     OWNER / ADMIN NATIVE PLAN EDITOR
     ---------------------------------------------------------- */
  function gl113Clone(v){return JSON.parse(JSON.stringify(v||{}));}
  function gl113PlanLines(plan){
    return String(plan||"").replace(/\\r\\n/g,"\n").replace(/\\n/g,"\n").replace(/\r/g,"\n")
      .split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  }
  function gl113EstimateSets(ex){
    if(Number(ex&&ex.ownerSets)>0)return Number(ex.ownerSets);
    var n=gl113PlanLines(ex&&ex.plan).filter(function(line){
      if(/^pom[ińn]/i.test(line)||/^pomiń/i.test(line))return false;
      return /(?:\bkg\b|masa ciała|pusta sztanga|aktywacja).*?[x×]\s*\d+/i.test(line) ||
             /^[^|]{0,35}[x×]\s*\d+/i.test(line);
    }).length;
    return n>0?n:3;
  }
  function gl113EstimateReps(ex){
    if(ex&&ex.ownerReps)return String(ex.ownerReps);
    var lines=gl113PlanLines(ex&&ex.plan);
    for(var i=lines.length-1;i>=0;i--){
      var m=lines[i].match(/[x×]\s*(\d+(?:\s*-\s*\d+)?)/i);
      if(m)return m[1].replace(/\s+/g,"");
    }
    return "8-12";
  }
  function gl113OwnerPlanSource(){
    var plans=(data&&data.ownerPlansV1&&typeof data.ownerPlansV1==="object")
      ?gl113Clone(data.ownerPlansV1):gl113Clone(PLANS||{});

    /* Show current generic target overrides in the editor instead of stale
       built-in targets. Gym-specific targets remain untouched. */
    Object.keys(plans).forEach(function(plan){
      (plans[plan]||[]).forEach(function(ex){
        try{
          var x=data.planOverrides&&data.planOverrides[plan]&&data.planOverrides[plan][ex.name];
          if(x)ex.plan=String(x);
        }catch(e){}
        ex.ownerSets=gl113EstimateSets(ex);
        ex.ownerReps=gl113EstimateReps(ex);
      });
    });
    return plans;
  }
  function gl113ApplyOwnerPlans(){
    if(!glIsAdmin()||!data||!data.ownerPlansV1||typeof data.ownerPlansV1!=="object")return;
    try{
      var src=gl113Clone(data.ownerPlansV1);
      Object.keys(PLANS).forEach(function(k){delete PLANS[k];});
      Object.keys(src).forEach(function(k){PLANS[k]=src[k];});
    }catch(e){console.log("Owner plan apply:",e);}
  }
  window.gl113ApplyOwnerPlans=gl113ApplyOwnerPlans;

  function gl113OwnerCapture(){

    var arr=c.plans[c.planName]||[];
    arr.forEach(function(ex,i){
      function q(id){return document.getElementById("gl113_"+id+"_"+i);}

      if(q("rest"))ex.rest=Math.max(0,parseInt(q("rest").value,10)||0);
      if(q("plan")){
        var raw=String(q("plan").value||"").trim();
        if(!raw){
          var lines=[];
          for(var j=0;j<ex.ownerSets;j++)lines.push("x "+ex.ownerReps);
          raw=lines.join("\n");
        }
        ex.plan=raw;

    });

/* ======================================================================
   0.71.4 — GYM-AWARE OWNER PLAN EDITOR

   Existing runtime already supports:
   data.planOverridesByGym[gym][plan][exercise] -> exercise.plan
   via clonePlanForGymV31().

   This release exposes that layer in the owner's visual plan editor.
   Global mode edits structure/default plan.
   Gym mode edits the target/weights shown for that gym only.
   ====================================================================== */
(function(){
  function gl114Clone(v){
    try{return JSON.parse(JSON.stringify(v||{}));}catch(e){return {};}
  }
  function gl114Gyms(){
    try{
      if(Array.isArray(GYMS_V31)&&GYMS_V31.length)return GYMS_V31.slice();
    }catch(e){}
    return ["Siłownia Oskara","CityFit","Zdrofit Pruszków","Wyjazd"];
  }
  function gl114EnsureGymDrafts(drafts){
    drafts=drafts&&typeof drafts==="object"?drafts:{};
    gl114Gyms().forEach(function(g){
      if(!drafts[g]||typeof drafts[g]!=="object")drafts[g]={};
    });
    return drafts;
  }
  function gl114GlobalPlans(){
    var plans=(data&&data.ownerPlansV1&&typeof data.ownerPlansV1==="object")
      ?gl114Clone(data.ownerPlansV1)
      :gl114Clone(PLANS||{});

    /* Current global goal overrides are the effective global target. */
    Object.keys(plans).forEach(function(plan){
      (plans[plan]||[]).forEach(function(ex){
        try{
          var v=data.planOverrides&&data.planOverrides[plan]&&data.planOverrides[plan][ex.name];
          if(v)ex.plan=String(v);
        }catch(e){}
        if(!(Number(ex.ownerSets)>0)){
          var lines=String(ex.plan||"").replace(/\\n/g,"\n").split(/\n+/).filter(Boolean);
          ex.ownerSets=Math.max(1,lines.length||3);
        }
        if(!ex.ownerReps)ex.ownerReps="8-12";
      });
    });
    return plans;
  }
  function gl114GymOptions(selectedGym){
    var html="<option value='GLOBAL'"+(selectedGym==="GLOBAL"?" selected":"")+">PLAN OGÓLNY — struktura i domyślne cele</option>";
    gl114Gyms().forEach(function(g){
      html+="<option value='"+esc(g)+"'"+(selectedGym===g?" selected":"")+">"+esc(g)+" — cele / ciężary</option>";
    });
    return html;
  }
  function gl114PlanNames(c){
    return Object.keys((c&&c.plans)||{});
  }
  function gl114GlobalText(c,planName,ex){
    if(!ex)return "";
    return String(ex.plan||"");
  }
  function gl114GymBucket(c,gym,planName,create){
    if(!c.gymDrafts[gym]&&create)c.gymDrafts[gym]={};
    var g=c.gymDrafts[gym]||{};
    if(!g[planName]&&create)g[planName]={};
    return g[planName]||null;
  }
  function gl114GymOverride(c,gym,planName,exName){
    var b=gl114GymBucket(c,gym,planName,false);
    return b&&Object.prototype.hasOwnProperty.call(b,exName)?String(b[exName]||""):"";
  }
  function gl114HasGymOverride(c,gym,planName,exName){
    var b=gl114GymBucket(c,gym,planName,false);
    return !!(b&&Object.prototype.hasOwnProperty.call(b,exName)&&String(b[exName]||"").trim());
  }

  function gl114CaptureGlobal(c){
    if(!c||!c.planName||c.gym!=="GLOBAL")return;
    var arr=c.plans[c.planName]||[];
    arr.forEach(function(ex,i){
      function q(id){return document.getElementById("gl114_"+id+"_"+i);}
      var oldName=String(ex.name||"");
      var newName=q("name")?String(q("name").value||"").trim():oldName;
      if(!newName)newName="Ćwiczenie";

      /* If the exercise is renamed globally, move existing gym-specific
         targets to the new name so they are not lost. */
      if(oldName&&newName!==oldName){
        gl114Gyms().forEach(function(g){
          var b=gl114GymBucket(c,g,c.planName,false);
          if(b&&Object.prototype.hasOwnProperty.call(b,oldName)&&!Object.prototype.hasOwnProperty.call(b,newName)){
            b[newName]=b[oldName];
            delete b[oldName];
          }
        });
      }

      ex.name=newName;
      if(q("sets"))ex.ownerSets=Math.max(1,parseInt(q("sets").value,10)||1);
      if(q("reps"))ex.ownerReps=String(q("reps").value||"8-12").trim()||"8-12";
      if(q("rest"))ex.rest=Math.max(0,parseInt(q("rest").value,10)||0);
      if(q("plan")){
        var raw=String(q("plan").value||"").trim();
        if(!raw){
          var lines=[];
          for(var j=0;j<ex.ownerSets;j++)lines.push("x "+ex.ownerReps);
          raw=lines.join("\n");
        }
        ex.plan=raw;
      }
      ex.groups=Array.prototype.slice.call(
        document.querySelectorAll("input[name='gl114_groups_"+i+"']:checked")
      ).map(function(x){return x.value;});
    });

  function gl114CaptureGym(c){

    var arr=c.plans[c.planName]||[];
    var bucket=gl114GymBucket(c,c.gym,c.planName,true);
    arr.forEach(function(ex,i){
      var ta=document.getElementById("gl114_gym_plan_"+i);
      if(!ta)return;
      var val=String(ta.value||"").trim();
      var global=gl114GlobalText(c,c.planName,ex).trim();

      /* Same as global = no redundant override. */
      if(!val||val===global)delete bucket[ex.name];
      else bucket[ex.name]=val;
    });
  }

    if(!data.planOverrides)data.planOverrides={};
    data.ownerPlansV1=gl114Clone(c.plans);

    /* Global plan/goal layer. */
    Object.keys(c.plans).forEach(function(plan){
      if(!data.planOverrides[plan])data.planOverrides[plan]={};
      var valid={};
      (c.plans[plan]||[]).forEach(function(ex){
        data.planOverrides[plan][ex.name]=String(ex.plan||"");
        valid[ex.name]=true;
      });
      Object.keys(data.planOverrides[plan]).forEach(function(exName){
        if(!valid[exName])delete data.planOverrides[plan][exName];
      });
    });

    /* Gym-specific target layer. Clean stale plans/exercises. */
    c.gymDrafts=gl114EnsureGymDrafts(c.gymDrafts);
    gl114Gyms().forEach(function(g){
      var gp=c.gymDrafts[g]||{};
      Object.keys(gp).forEach(function(plan){
        if(!c.plans[plan]){delete gp[plan];return;}
        var valid={};
        (c.plans[plan]||[]).forEach(function(ex){valid[ex.name]=true;});
        Object.keys(gp[plan]||{}).forEach(function(exName){
          if(!valid[exName]||!String(gp[plan][exName]||"").trim())delete gp[plan][exName];
        });
        if(!Object.keys(gp[plan]||{}).length)delete gp[plan];
      });
    });
    data.planOverridesByGym=gl114Clone(c.gymDrafts);

    try{gl113ApplyOwnerPlans();}catch(e){}
    safeSave();

    alert(c.gym==="GLOBAL"
      ?"Plan ogólny został zapisany."
      :"Cele dla "+c.gym+" zostały zapisane.");
    gl114OwnerRender();
  };

    var ex=glManagedExercises(planName),html="<div class='mu-plan-preview'>";
    ex.forEach(function(e){
      var warm=(e.managedWarmups||[]).length,work=e.managedWorkSets||gl115ManagedWorkReps(e).length;
      var ref=glManagedLastOrStarterText(planName,Object.assign({},e,{managedSets:work}));
      var prefix=ref.source==="starter"?"Startowo":(ref.source==="last"?"Ostatni trening":"Poprzednio");
      html+="<div class='mu-plan-preview-card'><div class='mu-plan-preview-top'><div class='mu-plan-preview-name'>"+esc(e.name)+"</div><div class='mu-plan-preview-range'>"+(warm?warm+" rozgrz. + ":"")+work+" robocze</div></div><div class='mu-plan-preview-last'><b>"+prefix+":</b> "+esc(ref.text)+"</div></div>";
    });
    return html+"</div>";
  };

  function gl115PerformedCount(e){
    return (e&&Array.isArray(e.sets)?e.sets:[]).filter(function(s){return !(s&&s.skipped)&&String(s&&s.s||"").toLowerCase()!=="pominięte";}).length;
  }
  function gl115PlannedCount(e){
    if(!e)return 0;
    if(Number(e.managedSets)>0)return Number(e.managedSets);
    var t=String(e.plan||"").replace(/\\n/g,"\n");
    return t.split(/\n+/).filter(function(x){return /[x×]\s*\d+/.test(x);}).length||0;
  }
  function gl115CurrentTarget(e,performed){
    var warm=Array.isArray(e&&e.managedWarmups)?e.managedWarmups:[];
    if(performed<warm.length)return {warmup:true,text:(e.managedWarmupLabel||"Rozgrzewka")+" • "+warm[performed]+" powt."};
    if(Number(e&&e.managedWorkSets)>0){
      var wi=performed-warm.length,wr=gl115ManagedWorkReps(e);
      return {warmup:false,text:"Seria robocza "+(wi+1)+" • "+String(wr[wi]||e.managedReps||"zakres")+" powt."};
    }
    return {warmup:false,text:""};
  }

  function gl115RemoveActionDuplicates(){
    document.querySelectorAll(".mu-workout-tools-063,.gl110-managed-actions").forEach(function(el){el.remove();});
    document.querySelectorAll(".lux-nav-row").forEach(function(row){
      var t=String(row.textContent||"").toLowerCase();
      if(t.indexOf("pomiń ćwiczenie")>=0||t.indexOf("zamień ćwiczenie")>=0||t.indexOf("edytuj zamianę")>=0)row.remove();
      else if(t.indexOf("poprzednie")>=0&&t.indexOf("następne")>=0)row.classList.add("gl115-nav-row");
    });
  }

  function gl115CompactLast(card){
    if(!card||card.querySelector(".gl115-last"))return;
    var details=card.querySelector(".lux-details");if(!details)return;
    var box=details.querySelector(".box"),val=String(box&&box.textContent||"").trim();
    var last=document.createElement("div");last.className="gl115-last";
    last.innerHTML="<div class='k'>Ostatnio</div><div class='v'>"+esc(val||"Brak poprzedniego wyniku")+"</div>";
    details.replaceWith(last);
  }

  function gl115HideEmptyMood(){
    var noMood=!String(current&&current.mood||"").trim(),featureOff=false;
    try{featureOff=glIsManagedUser()&&typeof gl064MoodEnabled==="function"&&!gl064MoodEnabled();}catch(e){}
    if(noMood||featureOff){
      document.querySelectorAll(".lux-active-meta .lux-stat-card").forEach(function(card){
        var t=String(card.textContent||"").toLowerCase();
        if(t.indexOf("gotowość")>=0||t.indexOf("samopoczucie")>=0)card.style.display="none";
      });
    }
  }

  function gl115SimplifyExerciseScreen(){
    if(!current||!current.exercises||!current.exercises[idx])return;
    var app=document.getElementById("app");if(!app||!document.querySelector(".lux-current-card"))return;
    var e=current.exercises[idx];

    document.querySelectorAll(".gl110-next-note").forEach(function(x){x.remove();});
    gl115RemoveActionDuplicates();gl115HideEmptyMood();

    document.querySelectorAll("#app > .card").forEach(function(card){
      var txt=String(card.textContent||"").trim().toLowerCase();
      if(txt.indexOf("postęp treningu")===0)card.classList.add("gl115-hide-progress");
      if(txt.indexOf("podsumowanie ćwiczenia")===0)card.classList.add("gl115-hide-live-summary");
    });

    var currentCard=document.querySelector(".lux-current-card");
    if(currentCard&&!currentCard.querySelector(".gl115-ex-count")){
      var count=document.createElement("div");count.className="gl115-ex-count";count.textContent="ĆWICZENIE "+(idx+1)+" / "+current.exercises.length;
      currentCard.insertBefore(count,currentCard.firstChild);
      var oldK=currentCard.querySelector(".lux-kicker");
      if(oldK&&String(oldK.textContent||"").toLowerCase().indexOf("aktualne")>=0)oldK.remove();
    }

    if(glIsManagedUser()&&currentCard){
      var oldGoal=currentCard.querySelector(".gl110-managed-goal");if(oldGoal)oldGoal.remove();
      var planBox=currentCard.querySelector(".lux-plan-always");
      if(planBox){
        var goal=e.managedGoal?"<div class='gl115-coach-goal'><div class='k'>Cel trenera</div><div class='v'>"+esc(String(e.managedGoal))+"</div></div>":"";
        planBox.innerHTML="<div class='lux-plan-title'>Plan na dziś</div>"+goal+glManagedPlanRows(e);
      }
    }else if(currentCard){
      var title=currentCard.querySelector(".lux-plan-title");if(title)title.textContent="Plan na dziś";
      gl115CompactLast(currentCard);
    }

    var entry=document.querySelector(".lux-set-entry");
    if(entry){
      var performed=gl115PerformedCount(e),planned=gl115PlannedCount(e);
      var title=entry.querySelector(".lux-section-title");if(title)title.textContent="SERIA "+(performed+1)+(planned?" / "+planned:"");
      var oldTarget=entry.querySelector(".gl115-current-target");if(oldTarget)oldTarget.remove();
      var target=gl115CurrentTarget(e,performed);
      if(target.text){
        var badge=document.createElement("div");badge.className="gl115-current-target"+(target.warmup?" warmup":"");badge.textContent=target.text;
        if(title)title.insertAdjacentElement("afterend",badge);
      }
      var status=document.getElementById("ss");if(target.warmup&&status)status.value="rozgrzewka";
      var reps=document.getElementById("sr");
      if(reps&&target.text){var m=target.text.match(/•\s*(.+?)\s*powt/i);if(m)reps.placeholder=m[1];}
      var note=document.getElementById("sn");
      if(note){
        var label=note.previousElementSibling;
        if(!gl115SetNotesEnabled()){
          note.classList.add("gl115-note-hidden");
          if(label&&String(label.tagName||"").toLowerCase()==="label")label.classList.add("gl115-note-hidden");
        }
      }
    }

    var finish=document.querySelector(".lux-finish");
    if(finish){
      document.querySelectorAll(".gl115-next-card,.gl115-bottom-actions").forEach(function(x){x.remove();});
      var next=current.exercises[idx+1],nextCard=document.createElement("div");
      nextCard.className="gl115-next-card";
      nextCard.innerHTML="<div class='k'>Następne ćwiczenie</div><div class='v'>"+esc(next&&next.name?next.name:"Koniec treningu")+"</div>";
      var actions=document.createElement("div");actions.className="gl115-bottom-actions";
      var isSub=window.isSubstituteExercise&&window.isSubstituteExercise(e);
      actions.innerHTML="<button class='secondary' onclick='skipExerciseView()'>POMIŃ</button><button class='secondary swap' onclick='substituteExerciseView()'>"+(isSub?"EDYTUJ ZAMIANĘ":"ZAMIEŃ ĆWICZENIE")+"</button>";
      finish.parentNode.insertBefore(nextCard,finish);
      finish.parentNode.insertBefore(actions,finish);
    }
  }

  var gl115BaseExercise=window.exercise;
  window.exercise=exercise=function(){
    var r=gl115BaseExercise.apply(this,arguments);
    requestAnimationFrame(gl115SimplifyExerciseScreen);
    return r;
  };

  function gl115CleanDashboardMood(){
    var mood=String((data&&data.lastMeta&&data.lastMeta.mood)||"").trim();if(mood)return;
    document.querySelectorAll(".gl085-metric").forEach(function(card){
      if(String(card.textContent||"").toLowerCase().indexOf("samopoczucie")>=0)card.remove();
    });
  }
  var gl115BaseHome=window.home;
  window.home=home=function(){
    var r=gl115BaseHome.apply(this,arguments);
    requestAnimationFrame(gl115CleanDashboardMood);
    return r;
  };
})();



/* 0.71.5 managed suggestion alignment:
   warmups never inherit a previous working load, and working-set history
   remains aligned after adding warmup rows to an existing plan. */
(function(){
  var gl115BaseSuggestion=getSuggestion;
  getSuggestion=function(ex){
    if(!glIsManagedUser()||!ex||!Array.isArray(ex.managedWarmups)){
      return gl115BaseSuggestion.apply(this,arguments);
    }
    if(window.isSubstituteExercise&&window.isSubstituteExercise(ex)){
      return {w:"",r:"",s:"",n:""};
    }

    var performed=(ex.sets||[]).filter(function(s){
      return !(s&&s.skipped)&&String(s&&s.s||"").toLowerCase()!=="pominięte";
    }).length;
    var warmCount=ex.managedWarmups.length;

    if(performed<warmCount){
      return {w:"",r:"",s:"rozgrzewka",n:""};
    }

    var workIndex=performed-warmCount;
    var prev=glManagedPreviousWorkingSets(current&&current.training||"",ex.name);
    if(prev&&prev[workIndex]){
      var s=prev[workIndex];
      return {
        w:String(s.w!=null?s.w:(s.weight!=null?s.weight:"")),
        r:String(s.r!=null?s.r:(s.reps!=null?s.reps:"")),
        s:String(s.s||""),
        n:""
      };
    }

    var starter=glManagedStarterSets(ex.managedStarter,ex.managedWorkSets||3);
    if(starter&&starter[workIndex]){
      return {
        w:String(starter[workIndex].w||""),
        r:String(starter[workIndex].r||""),
        s:"",
        n:""
      };
    }
    return {w:"",r:"",s:"",n:""};
  };
  window.getSuggestion=getSuggestion;
})();



/* ======================================================================
   0.71.6 — FINAL ACTIVE WORKOUT LAYOUT TWEAKS
   - rest timer beside workout clock
   - Restart/Stop removed
   - explicit previous/next exercise labels
   - Skip/Swap below Finish
   ====================================================================== */
(function(){

  function gl116TopRestTimer(){
    var meta=document.querySelector(".lux-active-meta");
    var restCard=document.querySelector(".lux-rest-card");
    if(!meta||!restCard)return;

    meta.classList.add("gl116-top-stats");

    /* The current timer node may already be running. Move the node itself
       rather than recreating it, so its live countdown is preserved. */
    var timerNode=restCard.querySelector("#timer");
    if(!timerNode)return;

    var oldTop=meta.querySelector(".gl116-rest-stat");
    if(oldTop)oldTop.remove();

    var stat=document.createElement("div");
    stat.className="lux-stat-card gl116-rest-stat";
    stat.innerHTML="<div class='lux-stat-label'>Odpoczynek</div><div class='gl116-timer-slot'></div><div class='lux-stat-note'>Przerwa po serii</div>";
    stat.querySelector(".gl116-timer-slot").appendChild(timerNode);

    var timeCard=Array.prototype.slice.call(meta.children).find(function(card){
      return String(card.textContent||"").toLowerCase().indexOf("czas treningu")>=0;
    });

    if(timeCard&&timeCard.nextSibling)meta.insertBefore(stat,timeCard.nextSibling);
    else meta.appendChild(stat);

    /* If readiness exists, keep it but give it a full row below.
       If 0.71.5 hid it because mood is empty, no empty slot remains. */
    Array.prototype.slice.call(meta.children).forEach(function(card){
      if(card===timeCard||card===stat)return;
      var t=String(card.textContent||"").toLowerCase();
      if(t.indexOf("gotowość")>=0||t.indexOf("samopoczucie")>=0){
        card.classList.add("gl116-readiness-full");
      }
    });

    /* Remove the old rest card including Restart and Stop. */
    restCard.classList.add("gl116-remove-rest");
    restCard.remove();
  }

  function gl116NavigationLabels(){
    document.querySelectorAll(".lux-nav-row").forEach(function(row){
      var buttons=row.querySelectorAll("button");
      if(buttons.length<2)return;
      var joined=String(row.textContent||"").toLowerCase();
      if(joined.indexOf("poprzed")<0||joined.indexOf("następn")<0)return;

      row.classList.add("gl116-ex-nav");
      buttons[0].textContent="‹ POPRZEDNIE ĆWICZENIE";
      buttons[1].textContent="NASTĘPNE ĆWICZENIE ›";
    });
  }

  function gl116ActionOrder(){
    var finish=document.querySelector(".lux-finish");
    var actions=document.querySelector(".gl115-bottom-actions");
    if(!finish||!actions)return;

    actions.classList.add("gl116-actions-after-finish");

    /* Desired bottom order:
       previous/next -> next exercise info -> FINISH -> skip/swap */
    if(finish.nextSibling!==actions){
      finish.insertAdjacentElement("afterend",actions);
    }
  }

  function gl116ApplyWorkoutLayout(){
    if(!current)return;
    gl116TopRestTimer();
    gl116NavigationLabels();
    gl116ActionOrder();
  }

  /* 0.71.5 performs its simplification in requestAnimationFrame.
     Run one frame later so this patch is always the final layout pass. */
  var gl116BaseExercise=window.exercise;
  window.exercise=exercise=function(){
    var r=gl116BaseExercise.apply(this,arguments);
    requestAnimationFrame(function(){
      requestAnimationFrame(gl116ApplyWorkoutLayout);
    });
    return r;
  };

  /* saveSet can start the rest immediately after an automatic exercise
     transition. The #timer node remains the same node after being moved
     to the top, so the countdown keeps updating there. */
})();



/* ======================================================================
   0.71.7 — hide mood/readiness from active workout UI for everyone.
   This is display-only: current.mood and saved history remain unchanged.
   ====================================================================== */
(function(){
  function gl117RemoveMoodFromActiveWorkout(){
    if(!current)return;
    var meta=document.querySelector(".lux-active-meta");
    if(!meta)return;

    Array.prototype.slice.call(meta.children).forEach(function(card){
      var t=String(card.textContent||"").toLowerCase();
      if(t.indexOf("gotowość")>=0 || t.indexOf("samopoczucie")>=0){
        card.classList.add("gl117-hide-workout-mood");
        card.remove();
      }
    });

    /* Keep the top area strictly as two equal boxes:
       Czas treningu | Odpoczynek */
    meta.classList.add("gl116-top-stats");
  }

  var gl117BaseExercise=window.exercise;
  window.exercise=exercise=function(){
    var r=gl117BaseExercise.apply(this,arguments);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(gl117RemoveMoodFromActiveWorkout);
      });
    });
    return r;
  };

  window.gl117RemoveMoodFromActiveWorkout=gl117RemoveMoodFromActiveWorkout;
})();



/* ======================================================================
   0.71.8 — ACCOUNT TYPE BELOW PROFILE NAME
   ====================================================================== */
(function(){
  function gl118AccountTypeLabel(){
    var p=window.GL_PROFILE||{};
    var role=String(p.role||"").toLowerCase().trim();

    if(typeof window.gl113RoleLabel==="function"){
      try{return String(window.gl113RoleLabel(role)||"Klient");}catch(e){}
    }

    if(role==="admin")return "Admin";
    if(role==="trainer")return "Trener";
    if(role==="trainee")return "Podopieczny";
    return "Klient";
  }

  function gl118ApplyAccountType(){
    var copy=document.querySelector(".gl086-profile-button .gl085-account-copy");
    if(!copy)return;
    var sub=copy.querySelector("span");
    if(!sub)return;
    sub.classList.add("gl118-account-type");
    sub.textContent=gl118AccountTypeLabel();
  }

  var gl118BaseHome=window.home;
  window.home=home=function(){
    var r=gl118BaseHome.apply(this,arguments);
    requestAnimationFrame(function(){
      requestAnimationFrame(gl118ApplyAccountType);
    });
    return r;
  };

  window.gl118ApplyAccountType=gl118ApplyAccountType;
})();


runInstalledAppUpdates();
window.glAuthBootstrap();
})();
